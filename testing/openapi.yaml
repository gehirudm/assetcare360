# ==================== COMPONENTS ====================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from login response
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_token
      description: HTTP-only cookie automatically set by login endpoint

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        employee_id:
          type: string
          example: "LITRO-ADMIN-001"
        full_name:
          type: string
          example: "Admin User"
        role:
          type: string
          enum: [Admin, Maintenance Manager, Inventory Manager, Technical Officer, Supervisor, Driver, Machinary Operator]
          example: "Admin"
        department:
          type: string
          nullable: true
          example: "Administration"
        email:
          type: string
          format: email
          example: "admin@assetcare360.com"
        phone:
          type: string
          nullable: true
          example: "+94771234567"
        is_active:
          type: boolean
          example: true
        force_password_change:
          type: boolean
          example: false
          description: If true, user must change password on next login
        last_login:
          type: string
          format: date-time
          nullable: true
          example: "2025-10-20T10:30:00Z"
        created_at:
          type: string
          format: date-time
          example: "2025-01-15T08:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-10-20T10:30:00Z"

    Log:
      type: object
      properties:
        id:
          type: integer
          example: 12345
        user_id:
          type: integer
          nullable: true
          example: 1
        employee_id:
          type: string
          nullable: true
          example: "LITRO-ADMIN-001"
        user_name:
          type: string
          nullable: true
          example: "Admin User"
          description: User's full name (joined from users table)
        user_role:
          type: string
          nullable: true
          example: "Admin"
          description: User's role (joined from users table)
        method:
          type: string
          enum: [GET, POST, PUT, DELETE]
          example: "POST"
        endpoint:
          type: string
          example: "/api/users"
        action:
          type: string
          example: "Create User"
          description: Human-readable action from endpoint registry
        category:
          type: string
          example: "User Management"
          description: Category from endpoint registry
        request_body:
          type: string
          nullable: true
          example: '{"employee_id":"LITRO-INVMGR-003","full_name":"Jane Smith"}'
          description: Sanitized request body (sensitive data redacted)
        response_code:
          type: integer
          example: 201
        ip_address:
          type: string
          example: "192.168.1.100"
        user_agent:
          type: string
          nullable: true
          example: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)"
        created_at:
          type: string
          format: date-time
          example: "2025-10-20T14:23:45Z"

    EndpointMetadata:
      type: object
      properties:
        action:
          type: string
          example: "Create User"
        category:
          type: string
          example: "User Management"
        description:
          type: string
          example: "Create new user account"

    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Product Name"
        sku:
          type: string
          example: "SKU-001"
        description:
          type: string
          example: "Product description"
        quantity:
          type: integer
          example: 100
        price:
          type: number
          format: decimal
          example: 1500.00
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 10
        total_items:
          type: integer
          example: 50
        total_pages:
          type: integer
          example: 5
        has_next:
          type: boolean
          example: true
        has_prev:
          type: boolean
          example: false

    Error:
      type: object
      properties:
        status:
          type: string
          enum: [error]
          example: error
          description: Response status indicator (always 'error' for error responses)
        message:
          type: string
          example: "Error message"
        errors:
          type: array
          items:
            type: string
          example: ["Validation error details"]

  responses:
    BadRequest:
      description: Bad request - Invalid input data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: error
            message: "Invalid input data"
            errors: ["Full name is required", "Invalid email format"]

    Unauthorized:
      description: Unauthorized - Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: error
            message: "Authentication required"

    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: error
            message: "Access denied. Admin role required."

    NotFound:
      description: Not found - Resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: error
            message: "User not found"

  examples:
    LoginRequest:
      value:
        employee_id: "LITRO-ADMIN-001"
        password: "password123"

    LoginResponse:
      value:
        status: success
        message: "Login successful"
        data:
          token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
          user:
            id: 1
            employee_id: "LITRO-ADMIN-001"
            full_name: "Admin User"
            role: "Admin"
            department: "Administration"
            email: "admin@assetcare360.com"
            phone: "+94771234567"
            is_active: true
            force_password_change: false
            last_login: "2025-10-20T10:30:00Z"
            created_at: "2025-01-15T08:00:00Z"
            updated_at: "2025-10-20T10:30:00Z"
          force_password_change: false

    CreateUserRequest:
      value:
        employee_id: "LITRO-INVMGR-003"
        full_name: "Jane Smith"
        role: "Inventory Manager"
        department: "Inventory"
        email: "jane.smith@assetcare360.com"
        phone: "+94771234567"
        send_welcome_email: false

    CreateUserResponse:
      value:
        status: success
        message: "User created successfully"
        data:
          user:
            id: 11
            employee_id: "LITRO-INVMGR-003"
            full_name: "Jane Smith"
            role: "Inventory Manager"
            department: "Inventory"
            email: "jane.smith@assetcare360.com"
            phone: "+94771234567"
            is_active: true
            force_password_change: true
            created_at: "2025-10-20T14:30:00Z"
            updated_at: "2025-10-20T14:30:00Z"
          generated_password: "aB3$xY9z"

