                    type: integer
                  description: Array of image IDs to delete
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  minLength: 10
                priority:
                  type: string
                  enum: [Low, Medium, High, Critical]
                location:
                  type: string
                status:
                  type: string
                  enum: [Open, Assigned, Waiting for Budget Approval, Waiting for Spare Parts, Parts Approved, In Progress, Resolved, Closed]
      responses:
        '200':
          description: Fault ticket updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Fault ticket updated successfully
        '400':
          description: Bad request (e.g., ticket not pending)
          content:
            application/json:
              schema:
