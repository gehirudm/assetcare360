  # ==================== ROUTE BREAKDOWN GARAGE WORKFLOW ====================
  /route-breakdowns/{id}/garage-approval:
    post:
      tags:
        - Route Breakdowns
      summary: Supervisor approves garage for a route breakdown
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - garage_id
              properties:
                garage_id:
                  type: integer
                  example: 1
                approval_notes:
                  type: string
                  nullable: true
                  example: Proceed with this approved workshop.
      responses:
        '200':
          description: Garage approved successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /route-breakdowns/{id}/garage-entry:
    post:
      tags:
        - Route Breakdowns
      summary: Driver logs entry to approved garage
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - entry_notes
              properties:
                entry_notes:
                  type: string
                  example: Arrived at garage and handed over vehicle.
      responses:
        '200':
          description: Garage entry logged successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /route-breakdowns/{id}/garage-progress:
    post:
      tags:
        - Route Breakdowns
      summary: Add route breakdown garage progress update
      description: Accepts multipart form data with progress note and up to 5 progress images.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - progress_note
              properties:
                progress_note:
                  type: string
                  example: Engine disassembled and damaged gasket identified.
                progress_images:
                  type: array
                  maxItems: 5
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Progress update submitted successfully
        '400':
          $ref: '#/components/responses/BadRequest'

  /route-breakdowns/{id}/garage-complete:
    post:
      tags:
        - Route Breakdowns
      summary: Complete route breakdown with bill proof
      description: Bill amount, bill image, and completion remarks are mandatory.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - bill_amount
                - bill_image
                - completion_remarks
              properties:
                bill_amount:
                  type: number
                  format: float
                  example: 12500.00
                bill_image:
                  type: string
                  format: binary
                completion_remarks:
                  type: string
                  example: Repair completed and test run is successful.
      responses:
        '200':
          description: Route breakdown completed successfully
        '400':
          $ref: '#/components/responses/BadRequest'

  # ==================== FILE UPLOADS ====================
  /uploads/route-breakdowns/{folder}/{filename}:
    get:
      tags:
        - File Uploads
      summary: Retrieve route breakdown uploaded image
      description: Serves uploaded route breakdown progress and bill images.
      security: []
      parameters:
        - name: folder
          in: path
          required: true
          schema:
            type: string
            enum: [progress, bills]
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Image binary response
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

# ==================== COMPONENTS ====================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from login response
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_token
      description: HTTP-only cookie automatically set by login endpoint

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        employee_id:
          type: string
          example: "LITRO-ADMIN-001"
        full_name:
          type: string
          example: "Admin User"
        role:
          type: string
          enum: [Admin, Maintenance Manager, Inventory Manager, Transportation Manager, Technical Officer, Supervisor, Driver, Machinary Operator, Auction Officer]
          example: "Admin"
        technical_expertise:
          type: string
          nullable: true
          example: "General"
          description: Expertise/specialization for Technical Officers. Non-technical roles return null.
        department:
          type: string
          nullable: true
          example: "Administration"
        email:
          type: string
          format: email
          example: "admin@assetcare360.com"
        phone:
          type: string
          nullable: true
          example: "+94771234567"
        is_active:
          type: boolean
          example: true
        force_password_change:
          type: boolean
          example: false
          description: If true, user must change password on next login
        last_login:
          type: string
          format: date-time
          nullable: true
          example: "2025-10-20T10:30:00Z"
        created_at:
          type: string
          format: date-time
          example: "2025-01-15T08:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-10-20T10:30:00Z"

    TechnicianWithWorkload:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            technical_expertise:
              type: string
              example: "General"
              description: Technical officer specialization used for assignment matching.
            active_ticket_count:
              type: integer
              minimum: 0
              example: 2
              description: Number of currently active fault tickets assigned to the technician.

    Log:
      type: object
      properties:
        id:
          type: integer
          example: 12345
        user_id:
          type: integer
          nullable: true
          example: 1
        employee_id:
          type: string
          nullable: true
          example: "LITRO-ADMIN-001"
        user_name:
          type: string
          nullable: true
          example: "Admin User"
          description: User's full name (joined from users table)
        user_role:
          type: string
          nullable: true
          example: "Admin"
          description: User's role (joined from users table)
        method:
          type: string
          enum: [GET, POST, PUT, DELETE]
          example: "POST"
        endpoint:
          type: string
          example: "/api/users"
        action:
          type: string
          example: "Create User"
          description: Human-readable action from endpoint registry
        category:
          type: string
          example: "User Management"
          description: Category from endpoint registry
        request_body:
          type: string
          nullable: true
          example: '{"employee_id":"LITRO-INVMGR-003","full_name":"Jane Smith"}'
          description: Sanitized request body (sensitive data redacted)
        response_code:
          type: integer
          example: 201
        ip_address:
          type: string
          example: "192.168.1.100"
        user_agent:
          type: string
          nullable: true
          example: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)"
        created_at:
          type: string
          format: date-time
          example: "2025-10-20T14:23:45Z"

    EndpointMetadata:
      type: object
      properties:
        action:
          type: string
          example: "Create User"
        category:
          type: string
          example: "User Management"
        description:
          type: string
          example: "Create new user account"

    Product:
      type: object
      properties:
        id:
          type: integer
          example: 42
        sparepart_id:
          type: string
          example: "SPR-121"
        sku:
          type: string
          nullable: true
          example: null
        name:
          type: string
          example: "Hydraulic Pump"
        description:
          type: string
          nullable: true
          example: "High-pressure hydraulic pump"
        category:
          type: string
          enum: [machines, vehicles]
          example: machines
        quantity:
          type: integer
          example: 28
        unit_price:
          type: number
          format: float
          example: 0
        reorder_level:
          type: integer
          example: 10
        low_stock_threshold:
          type: integer
          example: 10
        compatible_machines:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: ["LPG Cylinder Filling Machine"]
        compatible_vehicles:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: []
        location:
          type: string
          nullable: true
          example: "LOCATION 1"
        is_active:
          type: integer
          enum: [0, 1]
          example: 1
        created_at:
          type: string
          format: date-time
          example: "2026-04-17T10:15:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-04-17T10:15:00Z"

    Notification:
      type: object
      properties:
        notification_id:
          type: string
          example: "3f0fb3fc-91a5-462c-9fcf-a282218da9d4"
        user_id:
          type: integer
          nullable: true
          example: 7
        target_role:
          type: string
          nullable: true
          example: "Inventory Manager"
        title:
          type: string
          example: "Budget review required"
        message:
          type: string
          example: "A budget report is waiting for your approval."
        type:
          type: string
          enum: [info, success, warning, error]
          example: warning
        source_event:
          type: string
          example: "BUDGET_REPORT_CREATED"
        source_event_id:
          type: string
          nullable: true
          example: "BR-001"
        is_read:
          type: integer
          enum: [0, 1]
          example: 0
        read_at:
          type: string
          nullable: true
          format: date-time
        created_at:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 10
        total_items:
          type: integer
          example: 50
        total_pages:
          type: integer
          example: 5
        has_next:
          type: boolean
          example: true
        has_prev:
          type: boolean
          example: false

    Error:
      type: object
      properties:
        status:
          type: string
          enum: [error]
          example: error
          description: Response status indicator (always 'error' for error responses)
        message:
          type: string
          example: "Error message"
        errors:
          type: array
          items:
            type: string
          example: ["Validation error details"]

  responses:
    BadRequest:
      description: Bad request - Invalid input data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: error
            message: "Invalid input data"
            errors: ["Full name is required", "Invalid email format"]

    Unauthorized:
      description: Unauthorized - Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: error
            message: "Authentication required"

    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: error
            message: "Access denied. Admin role required."

    NotFound:
      description: Not found - Resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            status: error
            message: "User not found"

  examples:
    LoginRequest:
      value:
        employee_id: "LITRO-ADMIN-001"
        password: "password123"

    LoginResponse:
