openapi: 3.0.3
info:
  title: AssetCare360 Inventory Management API
  description: |
    Backend API for AssetCare360 Inventory Management System.
    
    ## Authentication
    This API uses JWT (JSON Web Tokens) for authentication. Tokens can be provided in two ways:
    1. **HTTP-only Cookie** (Recommended): Set automatically by the `/auth/login` endpoint
    2. **Authorization Header**: Send token as `Bearer <token>` in the Authorization header
    
    ## Authorization
    Access to endpoints is restricted based on user roles:
    - **Admin**: Full system access including user management
    - **Inventory Manager**: Inventory operations
    - **Supervisor**: Supervisory access
    - **Driver**: Driver-specific operations
    - **Machinary Operator**: Equipment operations
    
  version: 1.0.0
  contact:
    name: AssetCare360 Development Team
    email: dev@assetcare360.com

servers:
  - url: http://localhost:8000/api
    description: Development server
  - url: https://api.assetcare360.com/api
    description: Production server

tags:
  - name: Authentication
    description: User authentication and session management
  - name: Users
    description: User management operations (Admin only)
  - name: System Logs
    description: System log viewing and analytics (Admin only)
  - name: Products
    description: Product/Inventory operations

security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  # ==================== AUTHENTICATION ====================
  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user and receive JWT token. Token is automatically set in HTTP-only cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - employee_id
                - password
              properties:
                employee_id:
                  type: string
                  example: "LITRO-ADMIN-001"
                  description: Unique employee identifier
                password:
                  type: string
                  format: password
                  example: "password123"
                  description: User password
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: JWT token set in HTTP-only cookie
              schema:
                type: string
                example: auth_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...; HttpOnly; Path=/; SameSite=Lax
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Login successful"
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        description: JWT token (also available in cookie)
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      user:
                        $ref: '#/components/schemas/User'
                      force_password_change:
                        type: boolean
                        description: Indicates if user must change password
                        example: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      description: Retrieve information about the currently authenticated user
      responses:
        '200':
          description: Current user information
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: User logout
      description: Clear authentication cookie and end session
      responses:
        '200':
          description: Logout successful
          headers:
            Set-Cookie:
              description: Cookie deletion directive
              schema:
                type: string
                example: auth_token=; HttpOnly; Path=/; Max-Age=0
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Logged out successfully"
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/change-password:
    post:
      tags:
        - Authentication
      summary: Change password
      description: Change the current user's password. Clears force_password_change flag if set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - new_password
              properties:
                current_password:
                  type: string
                  format: password
                  example: "oldPassword123"
                new_password:
                  type: string
                  format: password
                  example: "newPassword456"
                  minLength: 6
                  description: Must be at least 6 characters and different from current password
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Password changed successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/validate:
    get:
      tags:
        - Authentication
      summary: Validate token
      description: Check if the current authentication token is valid
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Token is valid"
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== USER MANAGEMENT ====================
  /users:
    get:
      tags:
        - Users
      summary: List all users
      description: |
        Get paginated list of users with optional filtering and search.
        **Requires Admin role.**
      parameters:
        - name: role
          in: query
          description: Filter by user role
          schema:
            type: string
            enum: [Admin, Inventory Manager, Supervisor, Driver, Machinary Operator]
        - name: status
          in: query
          description: Filter by active status
          schema:
            type: string
            enum: [active, inactive]
        - name: department
          in: query
          description: Filter by department
          schema:
            type: string
            example: "Inventory"
        - name: search
          in: query
          description: Search in full_name, email, employee_id
          schema:
            type: string
            example: "john"
        - name: page
          in: query
          description: Page number for pagination
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          description: Number of items per page
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: List of users retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      users:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - Users
      summary: Create new user
      description: |
        Create a new user account. A random password is generated and can be sent via email.
        **Requires Admin role.**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - employee_id
                - full_name
                - role
                - email
              properties:
                employee_id:
                  type: string
                  example: "LITRO-ADMIN-004"
                  description: Unique employee identifier
                full_name:
                  type: string
                  example: "John Doe"
                  minLength: 2
                role:
                  type: string
                  enum: [Admin, Inventory Manager, Supervisor, Driver, Machinary Operator]
                  example: "Inventory Manager"
                department:
                  type: string
                  example: "Inventory"
                  description: User's department
                email:
                  type: string
                  format: email
                  example: "john.doe@assetcare360.com"
                phone:
                  type: string
                  pattern: '^\+94\d{9}$'
                  example: "+94771234567"
                  description: Must be in format +94XXXXXXXXX
                send_welcome_email:
                  type: boolean
                  default: false
                  description: Send welcome email with credentials
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User created successfully"
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      generated_password:
                        type: string
                        example: "aB3$xY9z"
                        description: Generated password (only returned if not emailed)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Retrieve detailed information about a specific user. **Requires Admin role.**
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    put:
      tags:
        - Users
      summary: Update user
      description: Update user information. **Requires Admin role.**
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  example: "John Smith"
                  minLength: 2
                role:
                  type: string
                  enum: [Admin, Inventory Manager, Supervisor, Driver, Machinary Operator]
                department:
                  type: string
                  example: "Operations"
                email:
                  type: string
                  format: email
                  example: "john.smith@assetcare360.com"
                phone:
                  type: string
                  pattern: '^\+94\d{9}$'
                  example: "+94771234567"
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User updated successfully"
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      tags:
        - Users
      summary: Delete user
      description: Soft delete a user (sets is_active to false). **Requires Admin role.**
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User deleted successfully"
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}/activate:
    put:
      tags:
        - Users
      summary: Activate user
      description: Reactivate a deactivated user account. **Requires Admin role.**
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: User activated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User activated successfully"
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}/deactivate:
    put:
      tags:
        - Users
      summary: Deactivate user
      description: Deactivate a user account (prevents login). **Requires Admin role.**
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: User deactivated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User deactivated successfully"
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}/reset-password:
    put:
      tags:
        - Users
      summary: Reset user password
      description: |
        Generate a new random password for the user and set force_password_change flag.
        **Requires Admin role.**
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Password reset successfully"
                  data:
                    type: object
                    properties:
                      new_password:
                        type: string
                        example: "xZ7$pQ2m"
                        description: New generated password
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/stats:
    get:
      tags:
        - Users
      summary: Get user statistics
      description: Get aggregated statistics about users. **Requires Admin role.**
      responses:
        '200':
          description: Statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      total_users:
                        type: integer
                        example: 50
                      active_users:
                        type: integer
                        example: 45
                      inactive_users:
                        type: integer
                        example: 5
                      users_by_role:
                        type: object
                        additionalProperties:
                          type: integer
                        example:
                          Admin: 3
                          "Inventory Manager": 10
                          Supervisor: 5
                          Driver: 20
                          "Machinary Operator": 12
                      users_by_department:
                        type: object
                        additionalProperties:
                          type: integer
                        example:
                          Administration: 3
                          Inventory: 10
                          Operations: 15
                          Logistics: 12
                          Production: 10
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ==================== SYSTEM LOGS ====================
  /logs:
    get:
      tags:
        - System Logs
      summary: Get system logs
      description: |
        Retrieve system request logs with advanced filtering and search capabilities.
        **Requires Admin role.**
      parameters:
        - name: category
          in: query
          description: Filter by log category
          schema:
            type: string
            enum: [Authentication, User Management, Inventory Management, System Administration, Other]
        - name: action
          in: query
          description: Filter by action (partial match)
          schema:
            type: string
            example: "User Login"
        - name: keyword
          in: query
          description: Search across action, endpoint, employee_id, user name
          schema:
            type: string
            example: "admin"
        - name: user_id
          in: query
          description: Filter by specific user ID
          schema:
            type: integer
            example: 1
        - name: employee_id
          in: query
          description: Filter by employee ID
          schema:
            type: string
            example: "LITRO-ADMIN-001"
        - name: method
          in: query
          description: Filter by HTTP method
          schema:
            type: string
            enum: [GET, POST, PUT, DELETE]
        - name: response_code
          in: query
          description: Filter by HTTP response code
          schema:
            type: integer
            example: 200
        - name: period
          in: query
          description: Filter by time period
          schema:
            type: string
            enum: [today, week, month, year, all]
            default: all
        - name: date_from
          in: query
          description: Filter logs from this date (YYYY-MM-DD HH:MM:SS)
          schema:
            type: string
            format: date-time
        - name: date_to
          in: query
          description: Filter logs until this date (YYYY-MM-DD HH:MM:SS)
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          description: Items per page (max 200)
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Logs retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      logs:
                        type: array
                        items:
                          $ref: '#/components/schemas/Log'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
                      filters_applied:
                        type: object
                        description: Summary of applied filters
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /logs/stats:
    get:
      tags:
        - System Logs
      summary: Get log statistics
      description: |
        Retrieve comprehensive statistics about system logs.
        **Requires Admin role.**
      parameters:
        - name: period
          in: query
          description: Statistics time period
          schema:
            type: string
            enum: [today, week, month, year, all]
            default: all
      responses:
        '200':
          description: Statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      period:
                        type: string
                        example: "week"
                      statistics:
                        type: object
                        properties:
                          total_requests:
                            type: integer
                            example: 1523
                          by_category:
                            type: object
                            additionalProperties:
                              type: integer
                            example:
                              Authentication: 450
                              "User Management": 320
                              "Inventory Management": 753
                          by_method:
                            type: object
                            additionalProperties:
                              type: integer
                            example:
                              GET: 980
                              POST: 350
                              PUT: 150
                              DELETE: 43
                          by_response_code:
                            type: object
                            additionalProperties:
                              type: integer
                            example:
                              200: 1420
                              201: 45
                              400: 35
                              401: 15
                              404: 8
                          top_users:
                            type: array
                            items:
                              type: object
                              properties:
                                user_id:
                                  type: integer
                                employee_id:
                                  type: string
                                request_count:
                                  type: integer
                          top_actions:
                            type: object
                            additionalProperties:
                              type: integer
                          error_rate:
                            type: number
                            format: float
                            example: 3.85
                          error_count:
                            type: integer
                            example: 58
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /logs/categories:
    get:
      tags:
        - System Logs
      summary: Get available log categories
      description: |
        Retrieve all available log categories from both registry and actual logs.
        **Requires Admin role.**
      responses:
        '200':
          description: Categories retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      registered_categories:
                        type: object
                        additionalProperties:
                          type: integer
                        description: Categories from endpoint registry
                      categories_with_logs:
                        type: object
                        additionalProperties:
                          type: integer
                        description: Categories with actual log entries
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /logs/registry:
    get:
      tags:
        - System Logs
      summary: Get endpoint registry
      description: |
        Retrieve endpoint registry showing all registered endpoints with their actions and categories.
        **Requires Admin role.**
      parameters:
        - name: search
          in: query
          description: Search endpoints by keyword
          schema:
            type: string
        - name: category
          in: query
          description: Filter by category
          schema:
            type: string
      responses:
        '200':
          description: Registry retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      endpoints:
                        type: object
                        additionalProperties:
                          $ref: '#/components/schemas/EndpointMetadata'
                      total:
                        type: integer
                        example: 25
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /logs/timeline:
    get:
      tags:
        - System Logs
      summary: Get activity timeline
      description: |
        Retrieve hourly activity timeline showing request counts over time.
        **Requires Admin role.**
      parameters:
        - name: period
          in: query
          description: Timeline period
          schema:
            type: string
            enum: [today, week, month, year]
            default: today
        - name: user_id
          in: query
          description: Filter timeline for specific user
          schema:
            type: integer
      responses:
        '200':
          description: Timeline retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      period:
                        type: string
                      user_id:
                        type: integer
                        nullable: true
                      timeline:
                        type: array
                        items:
                          type: object
                          properties:
                            hour:
                              type: string
                              format: date-time
                              example: "2025-10-20 14:00:00"
                            request_count:
                              type: integer
                              example: 45
                            unique_users:
                              type: integer
                              example: 8
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /logs/user/{id}:
    get:
      tags:
        - System Logs
      summary: Get logs for specific user
      description: |
        Retrieve all logs for a specific user with optional filtering.
        **Requires Admin role.**
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
        - name: period
          in: query
          description: Filter by time period
          schema:
            type: string
            enum: [today, week, month, year, all]
            default: all
        - name: category
          in: query
          description: Filter by category
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: User logs retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user_id:
                        type: integer
                      logs:
                        type: array
                        items:
                          $ref: '#/components/schemas/Log'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /logs/user/{id}/summary:
    get:
      tags:
        - System Logs
      summary: Get user activity summary
      description: |
        Retrieve activity summary and statistics for a specific user.
        **Requires Admin role.**
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
        - name: period
          in: query
          description: Summary time period
          schema:
            type: string
            enum: [today, week, month, year, all]
            default: all
      responses:
        '200':
          description: User activity summary retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user_id:
                        type: integer
                      period:
                        type: string
                      summary:
                        type: object
                        properties:
                          total_requests:
                            type: integer
                            example: 234
                          active_days:
                            type: integer
                            example: 15
                          first_activity:
                            type: string
                            format: date-time
                          last_activity:
                            type: string
                            format: date-time
                      activities:
                        type: array
                        items:
                          type: object
                          properties:
                            category:
                              type: string
                            action:
                              type: string
                            action_count:
                              type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /logs/export:
    get:
      tags:
        - System Logs
      summary: Export logs as CSV
      description: |
        Export filtered logs as CSV file (max 1000 records).
        **Requires Admin role.**
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: period
          in: query
          schema:
            type: string
            enum: [today, week, month, year, all]
            default: all
        - name: user_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ==================== PRODUCTS (PLACEHOLDER) ====================
  /products:
    get:
      tags:
        - Products
      summary: List all products
      description: Get list of all products in inventory
      responses:
        '200':
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'

# ==================== COMPONENTS ====================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from login response
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_token
      description: HTTP-only cookie automatically set by login endpoint

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        employee_id:
          type: string
          example: "LITRO-ADMIN-001"
        full_name:
          type: string
          example: "Admin User"
        role:
          type: string
          enum: [Admin, Inventory Manager, Supervisor, Driver, Machinary Operator]
          example: "Admin"
        department:
          type: string
          nullable: true
          example: "Administration"
        email:
          type: string
          format: email
          example: "admin@assetcare360.com"
        phone:
          type: string
          nullable: true
          example: "+94771234567"
        is_active:
          type: boolean
          example: true
        force_password_change:
          type: boolean
          example: false
          description: If true, user must change password on next login
        last_login:
          type: string
          format: date-time
          nullable: true
          example: "2025-10-20T10:30:00Z"
        created_at:
          type: string
          format: date-time
          example: "2025-01-15T08:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-10-20T10:30:00Z"

    Log:
      type: object
      properties:
        id:
          type: integer
          example: 12345
        user_id:
          type: integer
          nullable: true
          example: 1
        employee_id:
          type: string
          nullable: true
          example: "LITRO-ADMIN-001"
        user_name:
          type: string
          nullable: true
          example: "Admin User"
          description: User's full name (joined from users table)
        user_role:
          type: string
          nullable: true
          example: "Admin"
          description: User's role (joined from users table)
        method:
          type: string
          enum: [GET, POST, PUT, DELETE]
          example: "POST"
        endpoint:
          type: string
          example: "/api/users"
        action:
          type: string
          example: "Create User"
          description: Human-readable action from endpoint registry
        category:
          type: string
          example: "User Management"
          description: Category from endpoint registry
        request_body:
          type: string
          nullable: true
          example: '{"employee_id":"LITRO-INVMGR-003","full_name":"Jane Smith"}'
          description: Sanitized request body (sensitive data redacted)
        response_code:
          type: integer
          example: 201
        ip_address:
          type: string
          example: "192.168.1.100"
        user_agent:
          type: string
          nullable: true
          example: "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)"
        created_at:
          type: string
          format: date-time
          example: "2025-10-20T14:23:45Z"

    EndpointMetadata:
      type: object
      properties:
        action:
          type: string
          example: "Create User"
        category:
          type: string
          example: "User Management"
        description:
          type: string
          example: "Create new user account"

    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Product Name"
        sku:
          type: string
          example: "SKU-001"
        description:
          type: string
          example: "Product description"
        quantity:
          type: integer
          example: 100
        price:
          type: number
          format: decimal
          example: 1500.00
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 10
        total_items:
          type: integer
          example: 50
        total_pages:
          type: integer
          example: 5
        has_next:
          type: boolean
          example: true
        has_prev:
          type: boolean
          example: false

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Error message"
        errors:
          type: array
          items:
            type: string
          example: ["Validation error details"]

  responses:
    BadRequest:
      description: Bad request - Invalid input data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            message: "Invalid input data"
            errors: ["Full name is required", "Invalid email format"]

    Unauthorized:
      description: Unauthorized - Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            message: "Authentication required"

    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            message: "Access denied. Admin role required."

    NotFound:
      description: Not found - Resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            message: "User not found"

  examples:
    LoginRequest:
      value:
        employee_id: "LITRO-ADMIN-001"
        password: "password123"

    LoginResponse:
      value:
        success: true
        message: "Login successful"
        data:
          token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
          user:
            id: 1
            employee_id: "LITRO-ADMIN-001"
            full_name: "Admin User"
            role: "Admin"
            department: "Administration"
            email: "admin@assetcare360.com"
            phone: "+94771234567"
            is_active: true
            force_password_change: false
            last_login: "2025-10-20T10:30:00Z"
            created_at: "2025-01-15T08:00:00Z"
            updated_at: "2025-10-20T10:30:00Z"
          force_password_change: false

    CreateUserRequest:
      value:
        employee_id: "LITRO-INVMGR-003"
        full_name: "Jane Smith"
        role: "Inventory Manager"
        department: "Inventory"
        email: "jane.smith@assetcare360.com"
        phone: "+94771234567"
        send_welcome_email: false

    CreateUserResponse:
      value:
        success: true
        message: "User created successfully"
        data:
          user:
            id: 11
            employee_id: "LITRO-INVMGR-003"
            full_name: "Jane Smith"
            role: "Inventory Manager"
            department: "Inventory"
            email: "jane.smith@assetcare360.com"
            phone: "+94771234567"
            is_active: true
            force_password_change: true
            created_at: "2025-10-20T14:30:00Z"
            updated_at: "2025-10-20T14:30:00Z"
          generated_password: "aB3$xY9z"
