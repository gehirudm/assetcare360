openapi: 3.0.3
info:
  title: AssetCare360 Inventory Management API
  description: |
    Backend API for AssetCare360 Inventory Management System.
    
    ## Response Format
    All API responses follow a standardized format:
    - **Success responses**: `{status: "success", message: "...", data: {...}}`
    - **Error responses**: `{status: "error", message: "...", errors: [...]}`
    
    The `status` field is always either `"success"` or `"error"`.
    
    ## Authentication
    This API uses JWT (JSON Web Tokens) for authentication. Tokens can be provided in two ways:
    1. **HTTP-only Cookie** (Recommended): Set automatically by the `/auth/login` endpoint
    2. **Authorization Header**: Send token as `Bearer <token>` in the Authorization header
    
    ## Authorization
    Access to endpoints is restricted based on user roles:
    - **Admin**: Full system access including user management
    - **Maintenance Manager**: Manage maintenance operations and schedules
    - **Inventory Manager**: Inventory operations
    - **Transportation Manager**: Transportation operations and logistics
    - **Technical Officer**: Technical support and equipment management
    - **Supervisor**: Supervisory access
    - **Driver**: Driver-specific operations
    - **Machinary Operator**: Equipment operations
    
  version: 1.0.0
  contact:
    name: AssetCare360 Development Team
    email: dev@assetcare360.com

servers:
  - url: http://localhost:8000/api
    description: Development server
  - url: https://api.assetcare360.com/api
    description: Production server

tags:
  - name: Authentication
    description: User authentication and session management
  - name: Users
    description: User management operations (Admin only)
  - name: System Logs
    description: System log viewing and analytics (Admin only)
  - name: Products
    description: Product/Inventory operations
  - name: Budget Reports
    description: Budget report submission and approval workflow for fault tickets. Budgets within petty cash limit are approved by Supervisors; amounts exceeding the limit require Maintenance Manager approval.
  - name: Ticket Work Updates
    description: Technical Officer work completion updates for fault tickets.
  - name: System Settings
    description: System-wide configuration settings (Admin only). Includes petty cash limit for budget approval routing.
  - name: Trips
    description: Trip management for Transportation Manager and Drivers. Includes trip assignment, acceptance/rejection workflow, and trip lifecycle management.
  - name: Fuel Logs
    description: Vehicle fuel entry tracking with source-aware validation (internal vs external).
  - name: Notifications
    description: User notification listing and read-state updates.
  - name: Spare Part Requests
    description: Spare part request workflow. Technical Officers create requests for fault tickets, Inventory Managers approve/reject.
  - name: Sparepart Additions
    description: Stock addition tracking. Auto-updates spare part catalog quantities and can auto-create new spare parts.
  - name: Route Breakdowns
    description: Route breakdown reporting and approved garage repair workflow.
  - name: Garages
    description: Registered garage directory used by route breakdown workflow.
  - name: File Uploads
    description: Uploaded image retrieval endpoints.

security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  # ==================== AUTHENTICATION ====================
  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user and receive JWT token. Token is automatically set in HTTP-only cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - employee_id
                - password
              properties:
                employee_id:
                  type: string
                  example: "LITRO-ADMIN-001"
                  description: Unique employee identifier
                password:
                  type: string
                  format: password
                  example: "password123"
                  description: User password
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: JWT token set in HTTP-only cookie
              schema:
                type: string
                example: auth_token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...; HttpOnly; Path=/; SameSite=Lax
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [success, error]
                    example: success
                    description: Response status indicator
                  message:
                    type: string
                    example: "Login successful"
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        description: JWT token (also available in cookie)
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      user:
                        $ref: '#/components/schemas/User'
                      force_password_change:
                        type: boolean
                        description: Indicates if user must change password
                        example: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      description: |
        Get information about the currently authenticated user.
        Returns null in data field if no user is authenticated (does not return 401).
        This endpoint can be called without authentication.
      security: []
      responses:
        '200':
          description: Success (returns user if authenticated, null if not)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [success, error]
                    example: success
                  message:
                    type: string
                    example: "User authenticated"
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/User'
                      - type: "null"
              examples:
                authenticated:
                  summary: User is authenticated
                  value:
                    status: success
                    message: "User authenticated"
                    data:
                      id: 1
                      employee_id: "LITRO-ADMIN-001"
                      full_name: "Admin User"
                      role: "Admin"
                notAuthenticated:
                  summary: User is not authenticated
                  value:
                    status: success
                    message: "No user authenticated"
                    data: null

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: User logout
      description: Clear authentication cookie and end session
      responses:
        '200':
          description: Logout successful
          headers:
            Set-Cookie:
              description: Cookie deletion directive
              schema:
                type: string
                example: auth_token=; HttpOnly; Path=/; Max-Age=0
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Logged out successfully"
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/change-password:
    post:
      tags:
        - Authentication
      summary: Change password
      description: Change the current user's password. Clears force_password_change flag if set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - new_password
              properties:
                current_password:
                  type: string
                  format: password
                  example: "oldPassword123"
                new_password:
                  type: string
                  format: password
                  example: "newPassword456"
                  minLength: 6
                  description: Must be at least 6 characters and different from current password
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Password changed successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/profile:
    get:
      tags:
        - Authentication
      summary: Get user profile
      description: Get complete profile information for the current user from database (includes all user fields except password)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Profile retrieved successfully"
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 15
                      employee_id:
                        type: string
                        example: "LITRO-TECHOFFICER-001"
                      full_name:
                        type: string
                        example: "Technical Officer One"
                      role:
                        type: string
                        example: "Technical Officer"
                      department:
                        type: string
                        nullable: true
                        example: "Engineering"
                      email:
                        type: string
                        nullable: true
                        example: "officer@example.com"
                      phone:
                        type: string
                        nullable: true
                        example: "+94771234567"
                      is_active:
                        type: integer
                        example: 1
                      force_password_change:
                        type: integer
                        example: 0
                      last_login:
                        type: string
                        format: date-time
                        nullable: true
                        example: "2025-10-24 14:30:00"
                      created_at:
                        type: string
                        format: date-time
                        example: "2025-01-15 10:00:00"
                      updated_at:
                        type: string
                        format: date-time
                        example: "2025-10-24 14:30:00"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    
    put:
      tags:
        - Authentication
      summary: Update user profile
      description: Update the current user's profile information (full name and phone number)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - full_name
              properties:
                full_name:
                  type: string
                  example: "John Smith"
                  description: User's full name
                phone:
                  type: string
                  example: "+94771234567"
                  description: User's phone number (optional)
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  message:
                    type: string
                    example: "Profile updated successfully"
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/validate:
    get:
      tags:
        - Authentication
      summary: Validate token
      description: Check if the current authentication token is valid
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Token is valid"
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request password reset
      description: Request a password reset link to be sent to the user's email address
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - employee_id
                - email
              properties:
                employee_id:
                  type: string
                  example: "LITRO-ADMIN-001"
                  description: User's employee ID
                email:
                  type: string
                  format: email
                  example: "user@example.com"
                  description: User's registered email address
      responses:
        '200':
          description: Password reset request processed (always returns success for security)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "If your account exists, you will receive a password reset email shortly."
                  debug_token:
                    type: string
                    description: "Reset token (only in development mode)"
                  debug_link:
                    type: string
                    description: "Reset link (only in development mode)"
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password with token
      description: Reset user password using the token received via email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - new_password
              properties:
                token:
                  type: string
                  example: "a1b2c3d4e5f6..."
                  description: Reset token from email link
                new_password:
                  type: string
                  format: password
                  example: "newpassword123"
                  description: New password (minimum 6 characters)
                  minLength: 6
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Password reset successfully. You can now log in with your new password."
        '400':
          description: Invalid token or password requirements not met
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Invalid or expired reset token"

  # ==================== USER MANAGEMENT ====================
  /technicians:
    get:
      tags:
        - Users
      summary: List technical officers for ticket assignment
      description: |
        Retrieve active Technical Officers with their expertise and current active ticket workload.
        Used by Supervisors when assigning fault tickets.
        **Requires Supervisor or Admin role.**
      responses:
        '200':
          description: Technical officers retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      users:
                        type: array
                        items:
                          $ref: '#/components/schemas/TechnicianWithWorkload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users:
    get:
      tags:
        - Users
      summary: List all users
      description: |
        Get paginated list of users with optional filtering and search.
        **Requires Admin role.**
      parameters:
        - name: role
          in: query
          description: Filter by user role
          schema:
            type: string
            enum: [Admin, Maintenance Manager, Inventory Manager, Transportation Manager, Technical Officer, Supervisor, Driver, Machinary Operator, Auction Officer]
        - name: status
          in: query
          description: Filter by active status
          schema:
            type: string
            enum: [active, inactive]
        - name: department
          in: query
          description: Filter by department
          schema:
            type: string
            example: "Inventory"
        - name: search
          in: query
          description: Search in full_name, email, employee_id
          schema:
            type: string
            example: "john"
        - name: page
          in: query
          description: Page number for pagination
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          description: Number of items per page
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: List of users retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      users:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - Users
      summary: Create new user
      description: |
        Create a new user account. A random password is generated and can be sent via email.
        **Requires Admin role.**
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - employee_id
                - full_name
                - role
                - email
              properties:
                employee_id:
                  type: string
                  example: "LITRO-ADMIN-004"
                  description: Unique employee identifier
                full_name:
                  type: string
                  example: "John Doe"
                  minLength: 2
                role:
                  type: string
                  enum: [Admin, Maintenance Manager, Inventory Manager, Transportation Manager, Technical Officer, Supervisor, Driver, Machinary Operator, Auction Officer]
                  example: "Inventory Manager"
                technical_expertise:
                  type: string
                  nullable: true
                  example: "General"
                  description: Required for Technical Officer role. Use "General" for all-rounders.
                department:
                  type: string
                  example: "Inventory"
                  description: User's department
                email:
                  type: string
                  format: email
                  example: "john.doe@assetcare360.com"
                phone:
                  type: string
                  pattern: '^\+94\d{9}$'
                  example: "+94771234567"
                  description: Must be in format +94XXXXXXXXX
                send_welcome_email:
                  type: boolean
                  default: false
                  description: Send welcome email with credentials
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User created successfully"
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      generated_password:
                        type: string
                        example: "aB3$xY9z"
                        description: Generated password (only returned if not emailed)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Retrieve detailed information about a specific user. **Requires Admin role.**
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    put:
      tags:
        - Users
      summary: Update user
      description: Update user information. **Requires Admin role.**
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name:
                  type: string
                  example: "John Smith"
                  minLength: 2
                role:
                  type: string
                  enum: [Admin, Maintenance Manager, Inventory Manager, Transportation Manager, Technical Officer, Supervisor, Driver, Machinary Operator, Auction Officer]
                technical_expertise:
                  type: string
                  nullable: true
                  example: "Engine Specialist"
                  description: Applicable when role is Technical Officer. Use "General" for all-rounders.
                department:
                  type: string
                  example: "Operations"
                email:
                  type: string
                  format: email
                  example: "john.smith@assetcare360.com"
                phone:
                  type: string
                  pattern: '^\+94\d{9}$'
                  example: "+94771234567"
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User updated successfully"
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      tags:
        - Users
      summary: Delete user
      description: Soft delete a user (sets is_active to false). **Requires Admin role.**
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User deleted successfully"
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}/activate:
    put:
      tags:
        - Users
      summary: Activate user
      description: Reactivate a deactivated user account. **Requires Admin role.**
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: User activated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User activated successfully"
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}/deactivate:
    put:
      tags:
        - Users
      summary: Deactivate user
      description: Deactivate a user account (prevents login). **Requires Admin role.**
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: User deactivated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User deactivated successfully"
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}/reset-password:
    put:
      tags:
        - Users
      summary: Reset user password
      description: |
        Generate a new random password for the user and set force_password_change flag.
        **Requires Admin role.**
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Password reset successfully"
                  data:
                    type: object
                    properties:
                      new_password:
                        type: string
                        example: "xZ7$pQ2m"
                        description: New generated password
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/stats:
    get:
      tags:
        - Users
      summary: Get user statistics
      description: Get aggregated statistics about users. **Requires Admin role.**
      responses:
        '200':
          description: Statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      total_users:
                        type: integer
                        example: 50
                      active_users:
                        type: integer
                        example: 45
                      inactive_users:
                        type: integer
                        example: 5
                      users_by_role:
                        type: object
                        additionalProperties:
                          type: integer
                        example:
                          Admin: 3
                          "Inventory Manager": 10
                          Supervisor: 5
                          Driver: 20
                          "Machinary Operator": 12
                      users_by_department:
                        type: object
                        additionalProperties:
                          type: integer
                        example:
                          Administration: 3
                          Inventory: 10
                          Operations: 15
                          Logistics: 12
                          Production: 10
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ==================== SYSTEM LOGS ====================
  /logs:
    get:
      tags:
        - System Logs
      summary: Get system logs
      description: |
        Retrieve system request logs with advanced filtering and search capabilities.
        **Requires Admin role.**
      parameters:
        - name: category
          in: query
          description: Filter by log category
          schema:
            type: string
            enum: [Authentication, User Management, Inventory Management, System Administration, Other]
        - name: action
          in: query
          description: Filter by action (partial match)
          schema:
            type: string
            example: "User Login"
        - name: keyword
          in: query
          description: Search across action, endpoint, employee_id, user name
          schema:
            type: string
            example: "admin"
        - name: user_id
          in: query
          description: Filter by specific user ID
          schema:
            type: integer
            example: 1
        - name: employee_id
          in: query
          description: Filter by employee ID
          schema:
            type: string
            example: "LITRO-ADMIN-001"
        - name: method
          in: query
          description: Filter by HTTP method
          schema:
            type: string
            enum: [GET, POST, PUT, DELETE]
        - name: response_code
          in: query
          description: Filter by HTTP response code
          schema:
            type: integer
            example: 200
        - name: period
          in: query
          description: Filter by time period
          schema:
            type: string
            enum: [today, week, month, year, all]
            default: all
        - name: date_from
          in: query
          description: Filter logs from this date (YYYY-MM-DD HH:MM:SS)
          schema:
            type: string
            format: date-time
        - name: date_to
          in: query
          description: Filter logs until this date (YYYY-MM-DD HH:MM:SS)
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          description: Items per page (max 200)
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Logs retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      logs:
                        type: array
                        items:
                          $ref: '#/components/schemas/Log'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
                      filters_applied:
                        type: object
                        description: Summary of applied filters
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

