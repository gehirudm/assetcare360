                        type: array
                        items:
                          $ref: '#/components/schemas/FaultTicket'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    post:
      tags:
        - Fault Tickets
      summary: Create new fault ticket
      description: Report a new fault with optional image attachments (max 5 images, 5MB each)
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - machine_id
                - description
                - priority
              properties:
                machine_id:
                  type: integer
                  description: ID of the machine with the fault (location is automatically fetched from machine record)
                description:
                  type: string
                  minLength: 10
                  description: Detailed fault description (minimum 10 characters)
                priority:
                  type: string
                  enum: [Low, Medium, High, Critical]
                  description: Fault priority level
                photos:
                  type: array
                  items:
                    type: string
                    format: binary
                  maxItems: 5
                  description: Fault images (JPEG, PNG, WebP only, max 5MB each)
      responses:
        '201':
          description: Fault ticket created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Fault ticket created successfully
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: ID of the created fault ticket
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Validation failed
                  errors:
                    type: object
                    properties:
                      machine_id:
                        type: string
                        example: Machine is required
                      description:
                        type: string
                        example: Description must be at least 10 characters
                      priority:
                        type: string
                        example: Invalid priority level
                      images:
                        type: array
                        items:
                          type: string
                        example: [Maximum 5 images allowed, file.jpg exceeds 5MB size limit]
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /fault-tickets/{id}:
    get:
      tags:
        - Fault Tickets
      summary: Get fault ticket by ID
      description: Retrieve a single fault ticket with its images
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Fault ticket ID
          schema:
            type: integer
      responses:
        '200':
          description: Successfully retrieved fault ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      ticket:
                        $ref: '#/components/schemas/FaultTicketWithImages'
        '404':
          description: Fault ticket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    put:
      tags:
        - Fault Tickets
      summary: Update fault ticket
      description: Update fault ticket description, priority, and images (add/remove). Only pending tickets can be edited.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Fault ticket ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                description:
                  type: string
                  minLength: 10
                  description: Updated fault description
                priority:
                  type: string
                  enum: [Low, Medium, High, Critical]
                  description: Updated priority level
                photos:
                  type: array
                  items:
                    type: string
                    format: binary
                  maxItems: 5
                  description: New images to add (max 5 total images per ticket)
                delete_images:
                  type: array
                  items:
                    type: integer
                  description: Array of image IDs to delete
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  minLength: 10
                priority:
                  type: string
                  enum: [Low, Medium, High, Critical]
                location:
                  type: string
                status:
                  type: string
                  enum: [Open, In Progress, Resolved, Closed]
      responses:
        '200':
          description: Fault ticket updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Fault ticket updated successfully
        '400':
          description: Bad request (e.g., ticket not pending)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Only pending tickets can be edited
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Validation failed
                  errors:
                    type: object
                    properties:
                      priority:
                        type: string
                        example: Invalid priority level
                      photos:
                        type: array
                        items:
                          type: string
                        example: ["Image 1: File too large", "Image 2: Invalid type"]
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    delete:
      tags:
        - Fault Tickets
      summary: Delete fault ticket
      description: Delete a fault ticket and all associated images. Only pending tickets can be deleted.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Fault ticket ID
          schema:
            type: integer
      responses:
        '200':
          description: Fault ticket deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Fault ticket deleted successfully
        '400':
          description: Bad request (e.g., ticket not pending)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Only pending tickets can be deleted
        '404':
          description: Fault ticket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== BUDGET REPORTS ====================
  /budget-reports:
    post:
      tags:
        - Budget Reports
      summary: Create budget report
      description: |
        Submit a new budget report for a fault ticket (Technical Officer only).
        
        **Requirements:**
        - Ticket must be in "Open" or "Assigned" status (before work begins)
        - After submission, ticket status automatically changes to "Waiting for Budget Approval"
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fault_ticket_id
                - quotation
                - justification
                - total_amount
              properties:
                fault_ticket_id:
                  type: integer
                  example: 1
                quotation:
                  type: string
                  example: "- Spare Part A: LKR 40,000.00\n- Labor (5 hours @ LKR 2,500/hr): LKR 12,500.00\n- Transportation: LKR 5,000.00\n- Miscellaneous: LKR 2,500.00"
                justification:
                  type: string
                  example: "The machine requires immediate repair to prevent further damage and maintain operational efficiency..."
                total_amount:
                  type: number
                  format: decimal
                  example: 60000.00
      responses:
        '201':
          description: Budget report created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Budget report created successfully
                  data:
                    type: object
                    properties:
                      report:
                        $ref: '#/components/schemas/BudgetReport'
        '400':
          description: Bad request (missing fields or invalid data)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Fault ticket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /budget-reports/pending:
    get:
      tags:
        - Budget Reports
      summary: Get all pending budget reports
      description: Retrieve all pending budget reports (Supervisor/Admin only)
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: List of pending budget reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      reports:
                        type: array
                        items:
                          $ref: '#/components/schemas/BudgetReport'

  /budget-reports/ticket/{id}:
    get:
      tags:
        - Budget Reports
      summary: Get budget reports for a ticket
      description: Retrieve all budget reports submitted for a specific fault ticket
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Fault ticket ID
          schema:
            type: integer
      responses:
        '200':
          description: List of budget reports for the ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      reports:
                        type: array
                        items:
                          $ref: '#/components/schemas/BudgetReport'

  /budget-reports/ticket/{id}/latest:
    get:
      tags:
        - Budget Reports
      summary: Get latest budget report for a ticket
      description: Retrieve the most recent budget report for a specific fault ticket
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Fault ticket ID
          schema:
            type: integer
      responses:
        '200':
          description: Latest budget report
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      report:
                        $ref: '#/components/schemas/BudgetReport'

  /budget-reports/{id}:
    put:
      tags:
        - Budget Reports
      summary: Update budget report
      description: |
        Update an existing budget report (submitter only, only pending/revised reports).
        
        **Requirements:**
        - Ticket must be before "In Progress" status (Open, Assigned, Waiting for Budget Approval, Waiting for Spare Parts)
        - Only pending or revised reports can be edited
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Budget report ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quotation:
                  type: string
                justification:
                  type: string
                total_amount:
                  type: number
                  format: decimal
      responses:
        '200':
          description: Budget report updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Budget report updated successfully
                  data:
                    type: object
                    properties:
                      report:
                        $ref: '#/components/schemas/BudgetReport'
    
    delete:
      tags:
        - Budget Reports
      summary: Delete budget report
      description: |
        Delete a budget report (submitter/admin only, only pending reports).
        
        **Requirements:**
        - Only reports with status "pending" can be deleted
        - Ticket must be before "In Progress" status
        - After deletion, ticket status reverts to "Assigned" (if technicians assigned) or "Open"
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Budget report ID
          schema:
            type: integer
      responses:
        '200':
          description: Budget report deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Budget report deleted successfully

  /budget-reports/{id}/review:
    post:
      tags:
        - Budget Reports
      summary: Review budget report
      description: Approve or reject a budget report (Supervisor/Admin only)
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Budget report ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [approved, rejected, revised]
                  example: approved
                review_notes:
                  type: string
                  example: "Budget approved. Please proceed with repairs."
      responses:
        '200':
          description: Budget report reviewed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Budget report reviewed successfully
                  data:
                    type: object
                    properties:
                      report:
                        $ref: '#/components/schemas/BudgetReport'

components:
  schemas:
    Machine:
      type: object
      properties:
        id:
          type: integer
        model_number:
          type: string
        machine_name:
          type: string
        location:
          type: string
        warranty_expiry:
          type: string
          format: date
        warranty_provider:
          type: string
        supplier_name:
          type: string
        supplier_contact:
          type: string
        service_interval_days:
          type: integer
        last_service_date:
          type: string
          format: date
        next_service_date:
          type: string
          format: date
        components:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [Active, Inactive, Under Maintenance, Decommissioned, For Auction]
        notes:
          type: string
        created_by:
          type: integer
        updated_by:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MachineInput:
      type: object
      required:
        - model_number
        - machine_name
        - location
        - supplier_name
        - service_interval_days
      properties:
        model_number:
          type: string
        machine_name:
          type: string
        location:
          type: string
        warranty_expiry:
          type: string
          format: date
        warranty_provider:
          type: string
        supplier_name:
          type: string
        supplier_contact:
          type: string
        service_interval_days:
          type: integer
          default: 90
        last_service_date:
          type: string
          format: date
        components:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [Active, Inactive, Under Maintenance, Decommissioned, For Auction]
        notes:
          type: string

    Vehicle:
      type: object
      properties:
        id:
          type: integer
        vehicle_name:
          type: string
        model_number:
          type: string
        chassis_number:
          type: string
        number_plate:
          type: string
        vehicle_type:
          type: string
          enum: [Truck, Van, Car, Bus, Bike, Three-Wheeler, Lorry, Tanker, Other]
        fuel_type:
          type: string
          enum: [Petrol, Diesel, Electric, Hybrid, LPG, CNG]
        fuel_efficiency:
          type: number
          format: float
        warranty_expiry:
          type: string
          format: date
        warranty_provider:
          type: string
        supplier_name:
          type: string
        supplier_contact:
          type: string
        service_interval_type:
          type: string
          enum: [Time-Based, Mileage-Based, Both]
        service_interval_days:
          type: integer
        service_interval_km:
          type: integer
        current_mileage:
          type: integer
        last_service_date:
          type: string
          format: date
        last_service_mileage:
          type: integer
        next_service_date:
          type: string
          format: date
        next_service_mileage:
          type: integer
        status:
          type: string
          enum: [Active, Inactive, Under Maintenance, Decommissioned, For Auction]
        components:
          type: array
          items:
            type: string
          description: List of vehicle components
        notes:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VehicleInput:
      type: object
      required:
        - vehicle_name
        - model_number
        - chassis_number
        - number_plate
        - vehicle_type
        - fuel_type
        - supplier_name
        - service_interval_type
      properties:
        vehicle_name:
          type: string
        model_number:
          type: string
        chassis_number:
          type: string
        number_plate:
          type: string
        vehicle_type:
          type: string
          enum: [Truck, Van, Car, Bus, Bike, Three-Wheeler, Lorry, Tanker, Other]
        fuel_type:
          type: string
          enum: [Petrol, Diesel, Electric, Hybrid, LPG, CNG]
        fuel_efficiency:
          type: number
          format: float
        warranty_expiry:
          type: string
          format: date
        warranty_provider:
          type: string
        supplier_name:
          type: string
        supplier_contact:
          type: string
        service_interval_type:
          type: string
          enum: [Time-Based, Mileage-Based, Both]
        service_interval_days:
          type: integer
          description: Required when service_interval_type is 'Time-Based' or 'Both'
        service_interval_km:
          type: integer
          description: Required when service_interval_type is 'Mileage-Based' or 'Both'
        current_mileage:
          type: integer
          default: 0
          minimum: 0
        last_service_date:
          type: string
          format: date
          description: Must not be in the future
        last_service_mileage:
          type: integer
          description: Must be less than or equal to current_mileage
        status:
          type: string
          enum: [Active, Inactive, Under Maintenance, Decommissioned, For Auction]
        components:
          type: array
          items:
            type: string
          description: List of vehicle components
        notes:
          type: string

    FaultTicket:
      type: object
      properties:
        id:
          type: integer
        machine_id:
          type: integer
        machine_asset_tag:
          type: string
        machine_name:
          type: string
        reported_by:
          type: integer
        reporter_name:
          type: string
        reporter_first_name:
          type: string
        reporter_last_name:
          type: string
        description:
          type: string
        priority:
          type: string
          enum: [Low, Medium, High, Critical]
        location:
          type: string
        status:
          type: string
          enum: [Open, In Progress, Resolved, Closed]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    
    FaultTicketWithImages:
      allOf:
        - $ref: '#/components/schemas/FaultTicket'
        - type: object
          properties:
            images:
              type: array
              items:
                $ref: '#/components/schemas/FaultTicketImage'
    
    FaultTicketImage:
      type: object
      properties:
        id:
          type: integer
        fault_ticket_id:
          type: integer
        image_uuid:
          type: string
          format: uuid
        original_filename:
          type: string
        file_path:
          type: string
        file_size:
          type: integer
          description: File size in bytes
        mime_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        created_at:
          type: string
          format: date-time
    
    BudgetReport:
      type: object
      properties:
        id:
          type: integer
          example: 1
        fault_ticket_id:
          type: integer
          example: 1
        submitted_by:
          type: integer
          example: 5
        submitted_by_name:
          type: string
          example: "John Technician"
        submitted_by_employee_id:
          type: string
          example: "EMP-123"
        quotation:
          type: string
          example: "- Spare Part A: LKR 40,000.00\n- Labor (5 hours @ LKR 2,500/hr): LKR 12,500.00\n- Transportation: LKR 5,000.00"
        justification:
          type: string
          example: "The machine requires immediate repair to prevent further damage..."
        total_amount:
          type: string
          example: "60000.00"
        status:
          type: string
          enum: [pending, approved, rejected, revised]
          example: pending
        reviewed_by:
          type: integer
          nullable: true
          example: 3
        reviewed_by_name:
          type: string
          nullable: true
          example: "Jane Supervisor"
        reviewed_by_employee_id:
          type: string
          nullable: true
          example: "EMP-456"
        review_notes:
          type: string
          nullable: true
          example: "Budget approved. Please proceed with repairs."
        reviewed_at:
          type: string
          format: date-time
          nullable: true
          example: "2025-10-22T14:30:00Z"
        created_at:
          type: string
          format: date-time
          example: "2025-10-22T10:15:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-10-22T14:30:00Z"
    
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: An error occurred
        errors:
          type: array
          items:
            type: string
    
    Pagination:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
