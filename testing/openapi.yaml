          schema:
            type: integer
      responses:
        '200':
          description: Fault ticket deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Fault ticket deleted successfully
        '400':
          description: Bad request (e.g., ticket not pending)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Only pending tickets can be deleted
        '404':
          description: Fault ticket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /fault-tickets/{id}/assign:
    post:
      tags:
        - Fault Tickets
      summary: Assign technicians to fault ticket
      description: |
        Assign one or more Technical Officers to a fault ticket.

        **Rules:**
        - Requires Supervisor or Admin role
        - Ticket must be editable for assignment (`Open`, `Pending`, or `Assigned`)
        - Route-breakdown tickets with active nearby-garage workflow
          (`garage_approved`, `garage_entry_logged`, `repair_in_progress`, `completed`)
          cannot be assigned to technicians
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Fault ticket ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - technician_ids
              properties:
                technician_ids:
                  type: array
                  description: Technical Officer user IDs. Use an empty array only for unassignment flows.
                  items:
                    type: integer
                  example: [12, 17]
                priority:
                  type: string
                  enum: [Low, Medium, High, Critical]
                  example: High
                expected_completion_date:
                  type: string
                  format: date
                  nullable: true
                  example: '2026-04-20'
                notes:
                  type: string
                  nullable: true
                  example: Prioritize roadside safety checks first.
      responses:
        '200':
          description: Ticket assignment updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: 2 technician(s) assigned successfully
        '400':
          description: Assignment rejected due to validation or workflow rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                garageWorkflowActive:
                  summary: Route breakdown is already in nearby-garage workflow
                  value:
                    status: error
                    message: Nearby garage workflow is already active for this route breakdown. Technician assignment is not required.
                invalidTechnicianPayload:
                  summary: Invalid assignment payload
                  value:
                    status: error
                    message: Invalid technician data
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - only Supervisor/Admin can assign tickets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== TICKET WORK UPDATES ====================
  /ticket-work-updates:
    post:
      tags:
        - Ticket Work Updates
      summary: Create work update
      description: |
        Submit a work completion update for a fault ticket (Technical Officer only).

        **Requirements:**
        - `ticket_id`, `time_spent`, and `machine_description` are required
        - `time_spent` must be greater than 0
        - Ticket must not already have a work completion record
        - If the latest budget report for the ticket is `pending`, submission is blocked
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ticket_id
                - time_spent
                - machine_description
              properties:
                ticket_id:
                  type: integer
                  example: 1
                parts_used:
                  type: string
                  nullable: true
                  example: "Brake pads, hydraulic fluid"
                time_spent:
                  type: number
                  format: float
                  minimum: 0.01
                  example: 3.5
                machine_description:
                  type: string
                  example: "Replaced damaged line and verified system pressure stability."
                work_status:
                  type: string
                  example: Completed
      responses:
        '201':
          description: Work update created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Work update saved successfully
                  data:
                    type: object
                    properties:
                      work_update_id:
                        type: integer
                        example: 24
                      message:
                        type: string
                        example: Work update saved successfully
        '400':
          description: Bad request (validation failure or pending budget approval)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                pendingBudgetApproval:
                  summary: Budget report still pending
                  value:
                    status: error
                    message: "Cannot submit work update: the budget report for this ticket is still pending approval. Please wait for approval before starting work."
        '403':
          description: Forbidden - only Technical Officers can submit work updates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ticket-work-updates/ticket/{id}:
    get:
      tags:
        - Ticket Work Updates
      summary: Get work updates for a ticket
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Fault ticket ID
          schema:
            type: integer
      responses:
        '200':
          description: Work updates for ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      updates:
                        type: array
                        items:
                          $ref: '#/components/schemas/TicketWorkUpdate'
                      total_time:
                        type: number
                        format: float
                        example: 5.5
        '400':
          description: Ticket ID missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ticket-work-updates/latest/{id}:
    get:
      tags:
        - Ticket Work Updates
      summary: Get latest work update for a ticket
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Fault ticket ID
          schema:
            type: integer
      responses:
        '200':
          description: Latest work update
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/TicketWorkUpdate'
        '404':
          description: No work updates found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==================== BUDGET REPORTS ====================
  /budget-reports:
    post:
      tags:
        - Budget Reports
      summary: Create budget report
      description: |
        Submit a new budget report for a fault ticket (Technical Officer only).
        
        **Budget Approval Routing:**
        - If total_amount <= petty cash limit → approval_level = "supervisor" (Supervisor can approve)
        - If total_amount > petty cash limit → approval_level = "maintenance_manager" (Maintenance Manager must approve)
        
        **Requirements:**
        - Ticket must be in "Open" or "Assigned" status (before work begins)
        - After submission, ticket status automatically changes to "Waiting for Budget Approval"
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fault_ticket_id
                - quotation
                - justification
                - total_amount
              properties:
                fault_ticket_id:
                  type: integer
                  example: 1
                quotation:
                  type: string
                  example: "- Spare Part A: LKR 40,000.00\n- Labor (5 hours @ LKR 2,500/hr): LKR 12,500.00\n- Transportation: LKR 5,000.00\n- Miscellaneous: LKR 2,500.00"
                justification:
                  type: string
                  example: "The machine requires immediate repair to prevent further damage and maintain operational efficiency..."
                total_amount:
                  type: number
                  format: decimal
                  minimum: 0.01
                  example: 60000.00
      responses:
        '201':
          description: Budget report created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Budget report created. Awaiting Supervisor approval.
                  data:
                    type: object
                    properties:
                      report:
                        $ref: '#/components/schemas/BudgetReport'
                      approval_level:
                        type: string
                        enum: [supervisor, maintenance_manager]
                        example: supervisor
                      petty_cash_limit:
                        type: number
                        example: 50000.00
        '400':
          description: Bad request (missing fields or invalid data such as total_amount less than or equal to 0)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Fault ticket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /budget-reports/pending:
    get:
      tags:
        - Budget Reports
      summary: Get all pending budget reports
      description: |
        Retrieve pending budget reports filtered by the caller's role:
        - **Supervisor**: sees only supervisor-level reports (within petty cash limit)
        - **Maintenance Manager**: sees all pending reports
        - **Admin**: sees all pending reports
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: List of pending budget reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      reports:
                        type: array
                        items:
                          $ref: '#/components/schemas/BudgetReport'

  /budget-reports/ticket/{id}:
    get:
      tags:
        - Budget Reports
      summary: Get budget reports for a ticket
      description: Retrieve all budget reports submitted for a specific fault ticket
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Fault ticket ID
          schema:
            type: integer
      responses:
        '200':
          description: List of budget reports for the ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      reports:
                        type: array
                        items:
                          $ref: '#/components/schemas/BudgetReport'

  /budget-reports/ticket/{id}/latest:
    get:
      tags:
        - Budget Reports
      summary: Get latest budget report for a ticket
      description: Retrieve the most recent budget report for a specific fault ticket
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Fault ticket ID
          schema:
            type: integer
      responses:
        '200':
          description: Latest budget report
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      report:
                        $ref: '#/components/schemas/BudgetReport'

  /budget-reports/{id}:
    put:
      tags:
        - Budget Reports
      summary: Update budget report
      description: |
        Update an existing budget report (submitter only, only pending/revised reports).
        
        **Requirements:**
        - Ticket must be before "In Progress" status (Open, Assigned, Waiting for Budget Approval, Waiting for Spare Parts)
        - Only pending or revised reports can be edited
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Budget report ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quotation:
                  type: string
                justification:
                  type: string
                total_amount:
                  type: number
                  format: decimal
                  minimum: 0.01
      responses:
        '200':
          description: Budget report updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Budget report updated successfully
                  data:
                    type: object
                    properties:
                      report:
                        $ref: '#/components/schemas/BudgetReport'
    
    delete:
      tags:
        - Budget Reports
      summary: Delete budget report
      description: |
        Delete a budget report (submitter/admin only, only pending reports).
        
        **Requirements:**
        - Only reports with status "pending" can be deleted
        - Ticket must be before "In Progress" status
        - After deletion, ticket status reverts to "Assigned" (if technicians assigned) or "Open"
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Budget report ID
          schema:
            type: integer
      responses:
        '200':
          description: Budget report deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Budget report deleted successfully

  /budget-reports/{id}/review:
    post:
      tags:
        - Budget Reports
      summary: Review budget report
      description: |
        Approve or reject a budget report.
        
        **Role-based enforcement:**
        - Reports with approval_level "supervisor" → Supervisor, Maintenance Manager, or Admin can approve
        - Reports with approval_level "maintenance_manager" → only Maintenance Manager or Admin can approve
        
        **Status transitions on the fault ticket:**
        - Approved → ticket moves to "Assigned"
        - Rejected → ticket moves to "Assigned" (for resubmission)
        - Revised → ticket stays in "Waiting for Budget Approval"
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Budget report ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [approved, rejected, revised]
                  example: approved
                review_notes:
                  type: string
                  example: "Budget approved. Please proceed with repairs."
      responses:
        '200':
          description: Budget report reviewed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Budget report reviewed successfully
                  data:
                    type: object
                    properties:
                      report:
                        $ref: '#/components/schemas/BudgetReport'

  # ==================== SYSTEM SETTINGS ====================
  /system-settings:
    get:
      tags:
        - System Settings
      summary: Get all system settings
      description: Retrieve all system settings (Admin only)
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: List of system settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      settings:
                        type: array
                        items:
                          $ref: '#/components/schemas/SystemSetting'
        '403':
          description: Forbidden - Admin only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /system-settings/{key}:
    get:
      tags:
        - System Settings
      summary: Get a system setting by key
      description: Retrieve a single system setting by its key
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: key
          in: path
          required: true
          description: Setting key (e.g., petty_cash_limit)
          schema:
            type: string
      responses:
        '200':
          description: System setting
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      setting:
                        $ref: '#/components/schemas/SystemSetting'
        '404':
          description: Setting not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - System Settings
      summary: Update a system setting
      description: Update the value of a system setting (Admin only). Value is validated against the setting's data_type.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: key
          in: path
          required: true
          description: Setting key (e.g., petty_cash_limit)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - value
              properties:
                value:
                  description: The new value for the setting. Type must match the setting's data_type.
                  example: 75000.00
      responses:
        '200':
          description: Setting updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Setting updated successfully
                  data:
                    type: object
                    properties:
                      setting:
                        $ref: '#/components/schemas/SystemSetting'
        '400':
          description: Invalid value for setting data type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Setting not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    Machine:
      type: object
      properties:
        id:
          type: integer
        machine_id:
          type: string
        model_number:
          type: string
        machine_name:
          type: string
        location:
          type: string
        warranty_expiry:
          type: string
          format: date
        warranty_provider:
          type: string
        supplier_name:
          type: string
        supplier_contact:
          type: string
        service_interval_days:
          type: integer
        service_interval_hours:
          type: integer
          nullable: true
          description: Optional service interval in operating hours
        current_operating_hours:
          type: integer
          description: Current machine operating hours
        last_service_date:
          type: string
          format: date
        next_service_date:
          type: string
          format: date
        last_service_hours:
          type: integer
          nullable: true
          description: Operating hours at the last service
        next_service_hours:
          type: integer
          nullable: true
          description: Next service threshold in operating hours
        components:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [Active, Inactive, Under Maintenance, Decommissioned, For Auction]
        notes:
          type: string
        created_by:
          type: integer
        updated_by:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MachineInput:
      type: object
      required:
        - model_number
        - machine_name
        - location
        - supplier_name
        - service_interval_days
      properties:
        model_number:
          type: string
        machine_name:
          type: string
        location:
          type: string
        warranty_expiry:
          type: string
          format: date
        warranty_provider:
          type: string
        supplier_name:
          type: string
        supplier_contact:
          type: string
        service_interval_days:
          type: integer
          default: 90
        service_interval_hours:
          type: integer
          nullable: true
          description: Optional service interval in operating hours
        current_operating_hours:
          type: integer
          nullable: true
          minimum: 0
          description: Current machine operating hours
        last_service_date:
          type: string
          format: date
        last_service_hours:
          type: integer
          nullable: true
          minimum: 0
          description: Operating hours at the last service
        components:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [Active, Inactive, Under Maintenance, Decommissioned, For Auction]
        notes:
          type: string

    Vehicle:
      type: object
      properties:
