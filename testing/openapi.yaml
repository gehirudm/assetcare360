  # ==================== PRODUCTS ====================
  /products:
    get:
      tags:
        - Products
      summary: List catalog spareparts
      description: Returns active spareparts from the catalog. Use category filter for `machines` or `vehicles`.
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [machines, vehicles]
      responses:
        '200':
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      products:
                        type: array
                        items:
                          $ref: '#/components/schemas/Product'
                  message:
                    type: string
                    example: Products retrieved successfully
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Products
      summary: Create a sparepart in catalog
      description: Creates sparepart metadata in catalog. Initial stock is always `0`; stock additions must be recorded via `/additions`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - category
                - low_stock_threshold
              properties:
                sparepart_id:
                  type: string
                  example: "SPR-121"
                name:
                  type: string
                  example: "Hydraulic Pump"
                category:
                  type: string
                  enum: [machines, vehicles]
                  example: machines
                low_stock_threshold:
                  type: integer
                  minimum: 1
                  example: 12
                compatible_machines:
                  type: array
                  items:
                    type: string
                  example: ["LPG Cylinder Filling Machine", "Gas Compressor"]
                compatible_vehicles:
                  type: array
                  items:
                    type: string
                  example: []
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 42
                      sparepart_id:
                        type: string
                        example: "SPR-121"
                  message:
                    type: string
                    example: Product created successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /products/next-id:
    get:
      tags:
        - Products
      summary: Get next sparepart ID
      description: Returns the next generated sparepart ID in `SPR-###` format.
      responses:
        '200':
          description: Next product ID generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      next_id:
                        type: string
                        example: "SPR-122"
                  message:
                    type: string
                    example: Next product ID generated successfully
        '401':
          $ref: '#/components/responses/Unauthorized'

  /products/{id}:
    get:
      tags:
        - Products
      summary: Get product by ID
      description: Returns one sparepart by database ID or `SPR-###` sparepart ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/Product'
                  message:
                    type: string
                    example: Product retrieved successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags:
        - Products
      summary: Update catalog sparepart metadata
      description: Updates a sparepart by database ID or `SPR-###` sparepart ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Hydraulic Pump"
                category:
                  type: string
                  enum: [machines, vehicles]
                  example: machines
                low_stock_threshold:
                  type: integer
                  minimum: 1
                  example: 10
                compatible_machines:
                  type: array
                  items:
                    type: string
                compatible_vehicles:
                  type: array
                  items:
                    type: string
                quantity:
                  type: integer
                  minimum: 0
                  example: 35
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 42
                  message:
                    type: string
                    example: Product updated successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags:
        - Products
      summary: Soft-delete a sparepart
      description: Marks a sparepart as inactive by database ID or `SPR-###` sparepart ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Product deleted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications:
    get:
      tags:
        - Notifications
      summary: List notifications for the current user
      description: Returns notifications targeted to the authenticated user, role, or global broadcast notifications.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: unread_only
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Notifications retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Success
                  data:
                    type: object
                    properties:
                      notifications:
                        type: array
                        items:
                          $ref: '#/components/schemas/Notification'
                      pagination:
                        type: object
                        properties:
                          page:
                            type: integer
                            example: 1
                          limit:
                            type: integer
                            example: 20
                          total:
                            type: integer
                            example: 52
                          total_pages:
                            type: integer
                            example: 3
                      unread_count:
                        type: integer
                        example: 3
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/read:
    post:
      tags:
        - Notifications
      summary: Mark a notification as read
      description: Marks a specific notification as read, or all visible notifications when mark_all=true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notification_id:
                  type: string
                  example: "3f0fb3fc-91a5-462c-9fcf-a282218da9d4"
                mark_all:
                  type: boolean
                  example: false
      responses:
        '200':
          description: Read state updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Notification read state updated
                  data:
                    type: object
                    properties:
                      unread_count:
                        type: integer
                        example: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== SPARE PART REQUESTS ====================
  /spare-part-requests/check-availability:
    post:
      tags:
        - Spare Part Requests
      summary: Check availability of spare parts
      description: |
        Check availability of multiple spare parts before creating a request.
        Returns status for each part: available, insufficient, out_of_stock, or not_found.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - part_code
                    properties:
                      part_code:
                        type: string
                        example: "SPR-001"
                      quantity:
                        type: integer
                        default: 1
                        example: 5
      responses:
        '200':
          description: Availability check results
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            part_code:
                              type: string
                              example: "SPR-001"
                            part_name:
                              type: string
                              nullable: true
                              example: "Hydraulic Pump"
                            status:
                              type: string
                              enum: [available, insufficient, out_of_stock, not_found]
                              example: "available"
                            available_qty:
                              type: integer
                              example: 50
                            requested_qty:
                              type: integer
                              example: 5
                            reorder_level:
                              type: integer
                              example: 10
                            message:
                              type: string
                              example: "In stock (50 available)"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== SPAREPART ADDITIONS ====================
  /additions:
    post:
      tags:
        - Sparepart Additions
      summary: Record a spare part addition
      description: |
        Records stock addition for an existing spare part and updates catalog quantity.
        Sparepart must already exist in `/products`; this endpoint no longer auto-creates catalog records.
        Sparepart IDs must be in the `SPR-###` format.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sparepart_id
                - quantity_added
                - received_date
              properties:
                sparepart_id:
                  type: string
                  example: "SPR-001"
                sparepart_name:
                  type: string
                  description: Optional. Backend will use catalog name when available.
                  example: "Hydraulic Pump"
                quantity_added:
                  type: integer
                  minimum: 1
                  example: 10
                received_date:
                  type: string
                  format: date
                  example: "2026-04-15"
                category:
                  type: string
                  example: "Hydraulics"
                location:
                  type: string
                  example: "Warehouse A"
                supplier:
                  type: string
                  example: "ABC Suppliers"
                notes:
                  type: string
                  example: "Restocking order #1234"
      responses:
        '200':
          description: Addition recorded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      message:
                        type: string
                        example: "Addition recorded successfully"
                      previous_stock:
                        type: integer
                        example: 40
                      new_stock:
                        type: integer
                        example: 50
                      quantity_added:
                        type: integer
                        example: 10
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== GARAGES ====================
  /garages:
    get:
      tags:
        - Garages
      summary: List available garages
      description: Returns active garages by default. Supports optional search by `q`, filter by `city`, and `include_inactive=true` for Transportation Manager/Admin views.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: city
          in: query
          required: false
          schema:
            type: string
        - name: include_inactive
          in: query
          required: false
          schema:
            type: boolean
          description: Include inactive garages in the response.
      responses:
        '200':
          description: Garages fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      garages:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 1
                            name:
                              type: string
                              example: AutoCare Service Center
                            address:
                              type: string
                              example: 123 Galle Road, Colombo 03
                            city:
                              type: string
                              nullable: true
                              example: Colombo
                            phone:
                              type: string
                              nullable: true
                              example: +94 11 234 5678
                            latitude:
                              type: number
                              format: float
                              nullable: true
                            longitude:
                              type: number
                              format: float
                              nullable: true
                            is_active:
                              type: integer
                              example: 1
                      count:
                        type: integer
                        example: 5
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - Garages
      summary: Create a new garage
      description: "Creates a company-connected garage. Allowed roles: Transportation Manager and Admin."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - address
              properties:
                name:
                  type: string
                  maxLength: 255
                  example: Rapid Route Repairs
                address:
                  type: string
                  maxLength: 500
                  example: 18 Baseline Road, Colombo
                city:
                  type: string
                  nullable: true
                  maxLength: 100
                  example: Colombo
                phone:
                  type: string
                  nullable: true
                  maxLength: 50
                  example: +94 11 700 1234
                latitude:
                  type: number
                  format: float
                  nullable: true
                  minimum: -90
                  maximum: 90
                  example: 6.927079
                longitude:
                  type: number
