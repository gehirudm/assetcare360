      description: Retrieve active machines that need servicing by date (within 7 days) or operating-hour threshold
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Successfully retrieved machines due for service
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      machines:
                        type: array
                        items:
                          $ref: '#/components/schemas/Machine'

  # ==================== VEHICLES ====================
  /vehicles:
    get:
      tags:
        - Vehicles
      summary: Get all vehicles
      description: Retrieve a paginated list of vehicles with optional filtering and search
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [Active, Inactive, Under Maintenance, Decommissioned, For Auction]
        - name: vehicle_type
          in: query
          schema:
            type: string
        - name: fuel_type
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved vehicles
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      vehicles:
                        type: array
                        items:
                          $ref: '#/components/schemas/Vehicle'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
    post:
      tags:
        - Vehicles
      summary: Create a new vehicle
      description: Add a new vehicle to the inventory
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleInput'
      responses:
        '201':
          description: Vehicle created successfully

  /vehicles/{id}:
    get:
      tags:
        - Vehicles
      summary: Get vehicle by ID
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successfully retrieved vehicle
    put:
      tags:
        - Vehicles
      summary: Update vehicle
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleInput'
      responses:
        '200':
          description: Vehicle updated successfully
    delete:
      tags:
        - Vehicles
      summary: Delete vehicle
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Vehicle deleted successfully

  /vehicles/{id}/mileage:
    patch:
      tags:
        - Vehicles
      summary: Update vehicle mileage
      description: Updates the current mileage of a vehicle. New mileage must be greater than or equal to current mileage.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mileage:
                  type: integer
                  description: New mileage in kilometers (must be >= current mileage)
                  minimum: 0
              required:
                - mileage
      responses:
        '200':
          description: Mileage updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Mileage updated successfully
                  data:
                    $ref: '#/components/schemas/Vehicle'
        '400':
          description: Bad request - New mileage is less than current mileage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /vehicles/{id}/fuel-qr:
    post:
      tags:
        - Vehicles
      summary: Upload government fuel QR image
      description: Upload or replace the government-issued fuel QR image for a vehicle. Primarily used by Transportation Manager for external fuel station operations.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Vehicle ID
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - fuel_qr_image
              properties:
                fuel_qr_image:
                  type: string
                  format: binary
                  description: Government-issued vehicle fuel QR image (JPG, PNG, WEBP; max 5MB)
      responses:
        '200':
          description: Fuel QR image updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      vehicle:
                        $ref: '#/components/schemas/Vehicle'
        '400':
          description: Invalid request, image validation failure, or vehicle not found

  /vehicles/due-service:
    get:
      tags:
        - Vehicles
      summary: Get vehicles due for service
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Successfully retrieved vehicles due for service

  /vehicles/with-drivers:
    get:
      tags:
        - Vehicles
      summary: Get all vehicles with driver assignments
      description: Retrieve all vehicles including their assigned driver information. Used by Transportation Manager for driver assignment management.
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Successfully retrieved vehicles with driver assignments
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Success
                  data:
                    type: object
                    properties:
                      vehicles:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/Vehicle'
                            - type: object
                              properties:
                                assigned_driver_id:
                                  type: integer
                                  nullable: true
                                  description: ID of assigned driver (null if unassigned)
                                driver_assigned_at:
                                  type: string
                                  format: date-time
                                  nullable: true
                                  description: Timestamp when driver was assigned
                                driver_user_id:
                                  type: integer
                                  nullable: true
                                  description: User ID of assigned driver
                                driver_name:
                                  type: string
                                  nullable: true
                                  description: Full name of assigned driver
                                driver_employee_id:
                                  type: string
                                  nullable: true
                                  description: Employee ID of assigned driver
                                driver_phone:
                                  type: string
                                  nullable: true
                                  description: Phone number of assigned driver
        '401':
          description: Unauthorized

  /vehicles/{numberPlate}/with-driver:
    get:
      tags:
        - Vehicles
      summary: Get vehicle with driver by number plate
      description: Retrieve a specific vehicle by number plate including its assigned driver information.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: numberPlate
          in: path
          required: true
          schema:
            type: string
          description: Vehicle number plate (e.g., lk-1234)
      responses:
        '200':
          description: Successfully retrieved vehicle with driver
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      vehicle:
                        allOf:
                          - $ref: '#/components/schemas/Vehicle'
                          - type: object
                            properties:
                              assigned_driver_id:
                                type: integer
                                nullable: true
                              driver_assigned_at:
                                type: string
                                format: date-time
                                nullable: true
                              driver_user_id:
                                type: integer
                                nullable: true
                              driver_name:
                                type: string
                                nullable: true
                              driver_employee_id:
                                type: string
                                nullable: true
                              driver_phone:
                                type: string
                                nullable: true
        '404':
          description: Vehicle not found

  /vehicles/{id}/assign-driver:
    post:
      tags:
        - Vehicles
      summary: Assign driver to vehicle
      description: |
        Assign a driver to a vehicle. One driver can only be assigned to one vehicle at a time.
        If the driver is already assigned to another vehicle, they will be automatically unassigned from the previous vehicle.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Vehicle ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - driver_id
              properties:
                driver_id:
                  type: integer
                  description: User ID of the driver to assign
      responses:
        '200':
          description: Driver assigned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Driver assigned successfully
                  data:
                    type: object
                    properties:
                      vehicle:
                        $ref: '#/components/schemas/Vehicle'
        '400':
          description: Invalid driver (not active, not a driver role, etc.)
        '404':
          description: Vehicle or driver not found

  /vehicles/{id}/unassign-driver:
    post:
      tags:
        - Vehicles
      summary: Unassign driver from vehicle
      description: Remove the currently assigned driver from a vehicle.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Vehicle ID
      responses:
        '200':
          description: Driver unassigned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Driver unassigned successfully
                  data:
                    type: object
                    properties:
                      vehicle:
                        $ref: '#/components/schemas/Vehicle'
        '404':
          description: Vehicle not found

  # ==================== TRIPS ====================
  /trips:
    get:
      tags:
        - Trips
      summary: Get all trips
      description: Retrieve all trips with optional filtering by status and driver
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by trip status
          schema:
            type: string
            enum: [Pending, Accepted, Rejected, In Progress, Completed, Cancelled]
        - name: driver_id
          in: query
          description: Filter by driver ID
          schema:
            type: integer
      responses:
        '200':
          description: Successfully retrieved trips
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      trips:
                        type: array
                        items:
                          $ref: '#/components/schemas/Trip'
                  count:
                    type: integer

    post:
      tags:
        - Trips
      summary: Create a new trip (assign trip to driver)
      description: |
        Creates a pending trip record. `driver_id` is optional:
        - For Transportation Manager/Admin flows, if `driver_id` is omitted the backend uses the selected vehicle's assigned driver.
        - For Driver flows, the backend binds the trip to the authenticated driver.
        - Provide either `vehicle_registration` or `vehicle_id`.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - origin
                - destination
              properties:
                origin:
                  type: string
                destination:
                  type: string
                vehicle_registration:
                  type: string
                  description: Vehicle number plate. Required when vehicle_id is not provided.
                vehicle_id:
                  type: integer
                  description: Vehicle database ID. Required when vehicle_registration is not provided.
                driver_id:
                  type: integer
                  description: Optional. If omitted, backend resolves the driver from context.
                cargo_description:
                  type: string
      responses:
        '201':
          description: Trip created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      trip:
                        $ref: '#/components/schemas/Trip'
        '400':
          description: Validation error (for example vehicle has ongoing breakdown ticket)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Cannot create trip. Vehicle has an ongoing breakdown ticket (VBD-012).

  /trips/{tripId}:
    get:
      tags:
        - Trips
      summary: Get trip by ID
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved trip
        '404':
          description: Trip not found

    put:
      tags:
        - Trips
      summary: Update a trip (only pending trips)
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                origin:
                  type: string
                destination:
                  type: string
                vehicle_registration:
                  type: string
                driver_id:
                  type: integer
                cargo_description:
                  type: string
      responses:
        '200':
          description: Trip updated successfully

    delete:
      tags:
        - Trips
      summary: Delete a trip
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trip deleted successfully

  /trips/{tripId}/accept:
    post:
      tags:
        - Trips
      summary: Accept a trip assignment (Driver)
      description: Driver accepts a pending trip assignment. Changes status from Pending to Accepted.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trip accepted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      trip:
                        $ref: '#/components/schemas/Trip'
        '400':
          description: Bad request - Trip not in pending status

  /trips/{tripId}/reject:
    post:
      tags:
        - Trips
      summary: Reject a trip assignment (Driver)
      description: Driver rejects a pending trip assignment with a reason. Changes status from Pending to Rejected.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  description: Reason for rejecting the trip
      responses:
        '200':
          description: Trip rejected successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      trip:
                        $ref: '#/components/schemas/Trip'
        '400':
          description: Bad request - Trip not in pending status or missing reason

  /trips/{tripId}/start:
    post:
      tags:
        - Trips
      summary: Start a trip (Driver)
      description: Driver starts an accepted trip. Requires starting odometer reading. Optionally accepts assistant driver name.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                starting_odometer:
                  type: integer
                  description: Current odometer reading at trip start
                assistant_driver_name:
                  type: string
                  description: Name of assistant driver (optional)
      responses:
        '200':
          description: Trip started successfully
        '400':
          description: Bad request - Trip not in accepted status

  /trips/{tripId}/end:
    post:
      tags:
        - Trips
      summary: End a trip (Driver)
      description: Driver ends an in-progress trip with final odometer reading.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - final_odometer
              properties:
                final_odometer:
                  type: integer
                completion_notes:
                  type: string
      responses:
        '200':
          description: Trip ended successfully

  /trips/{tripId}/cancel:
    post:
      tags:
        - Trips
      summary: Cancel a trip
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trip cancelled successfully

  # ==================== FUEL LOGS ====================
  /fuel-logs:
    get:
      tags:
        - Fuel Logs
      summary: Get fuel logs
      description: Retrieve fuel logs with optional vehicle and driver filters.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: vehicle_registration
          in: query
          description: Filter by vehicle number plate/registration
          schema:
            type: string
        - name: driver_id
          in: query
          description: Filter by driver user ID
          schema:
            type: integer
      responses:
        '200':
          description: Successfully retrieved fuel logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      fuel_logs:
                        type: array
                        items:
                          $ref: '#/components/schemas/FuelLog'
                  count:
                    type: integer

    post:
      tags:
        - Fuel Logs
      summary: Create fuel log
      description: |
        Create a fuel log entry.

        Business rules:
        - `fuel_type` is derived automatically from the selected vehicle (`vehicles.fuel_type`).
        - `fuel_source` is required and must be `internal` or `external`.
        - For `external` fuel source, `total_cost` and `bill_image` are required.
        - For `internal` fuel source, `total_cost` and `bill_image` are optional.
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuelLogInput'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FuelLogMultipartInput'
      responses:
        '201':
          description: Fuel log created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      fuel_log:
                        $ref: '#/components/schemas/FuelLog'
        '400':
          description: Validation error (missing required fields, invalid source, or external fueling without cost/receipt)

  /fuel-logs/{fuelLogId}:
    get:
      tags:
        - Fuel Logs
      summary: Get fuel log by ID
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: fuelLogId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved fuel log
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      fuel_log:
                        $ref: '#/components/schemas/FuelLog'
        '404':
          description: Fuel log not found

    put:
      tags:
        - Fuel Logs
      summary: Update fuel log
      description: |
        Update fuel log details.

        Business rules for `fuel_source` apply on update as well:
        - `external`: requires positive `total_cost` and bill image path or existing stored bill image.
        - `internal`: allows empty `total_cost` and no bill image.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: fuelLogId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuelLogInput'
      responses:
        '200':
          description: Fuel log updated successfully
        '400':
          description: Invalid request data or validation failure

    delete:
      tags:
        - Fuel Logs
      summary: Delete fuel log
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: fuelLogId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Fuel log deleted successfully

  # ==================== FAULT TICKETS ====================
  /fault-tickets:
    get:
      tags:
        - Fault Tickets
      summary: Get all fault tickets
      description: Retrieve all fault tickets with optional filtering
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: machine_id
          in: query
          description: Filter by machine ID
          schema:
            type: integer
        - name: reported_by
          in: query
          description: Filter by reporter user ID
          schema:
            type: integer
        - name: status
          in: query
          description: Filter by ticket status
          schema:
            type: string
            enum: [Open, In Progress, Resolved, Closed]
        - name: priority
          in: query
          description: Filter by priority level
          schema:
            type: string
            enum: [Low, Medium, High, Critical]
      responses:
        '200':
          description: Successfully retrieved fault tickets
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      tickets:
                        type: array
                        items:
                          $ref: '#/components/schemas/FaultTicket'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    post:
      tags:
        - Fault Tickets
      summary: Create new fault ticket
      description: Report a new fault with optional image attachments (max 5 images, 5MB each)
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - machine_id
                - description
                - priority
              properties:
                machine_id:
                  type: integer
                  description: ID of the machine with the fault (location is automatically fetched from machine record)
                description:
                  type: string
                  minLength: 10
                  description: Detailed fault description (minimum 10 characters)
                priority:
                  type: string
                  enum: [Low, Medium, High, Critical]
                  description: Fault priority level
                photos:
                  type: array
                  items:
                    type: string
                    format: binary
                  maxItems: 5
                  description: Fault images (JPEG, PNG, WebP only, max 5MB each)
      responses:
        '201':
          description: Fault ticket created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Fault ticket created successfully
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: ID of the created fault ticket
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Validation failed
                  errors:
                    type: object
                    properties:
                      machine_id:
                        type: string
                        example: Machine is required
                      description:
                        type: string
                        example: Description must be at least 10 characters
                      priority:
                        type: string
                        example: Invalid priority level
                      images:
                        type: array
                        items:
                          type: string
                        example: [Maximum 5 images allowed, file.jpg exceeds 5MB size limit]
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
