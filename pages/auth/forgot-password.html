<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssetCare360 - Forgot Password</title>
    <style>
        .container {
            max-width: 400px;
            margin: 50px auto;
            padding: 30px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .welcome-img {
            max-width: 200px;
            margin-bottom: 20px;
        }

        .welcome-text {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin-bottom: 30px;
        }

        .login-form {
            text-align: left;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: #4a90e2;
            outline: none;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-btn:hover {
            background-color: #3a7bc8;
        }

        .login-btn:disabled {
            background-color: #a0c0e8;
            cursor: not-allowed;
        }

        .forgot-password {
            margin-top: 20px;
            text-align: center;
        }

        .forgot-password a {
            color: #4a90e2;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #999;
            font-size: 14px;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }

        .success-message {
            background-color: #e7f4e4;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
            text-align: left;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="/logo/with-text.jpeg" alt="AssetCare360 Logo" class="welcome-img" />
        <div class="welcome-text">Reset Your Password</div>
        <form id="forgotPasswordForm" class="login-form">
            <div class="form-group">
                <label for="employeeId">Employee ID:</label>
                <input type="text" id="employeeId" name="employeeId" placeholder="Enter your employee ID" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>
            <button type="submit" class="login-btn" onclick="handlePasswordReset(event)">
                Send Reset Link
            </button>
        </form>
        <div class="forgot-password">
            <a href="/login">Back to Login</a>
        </div>
        <div class="footer">
            © 2025 AssetCare360. All rights reserved.
        </div>
    </div>

    <script>
        function handlePasswordReset(event) {
            event.preventDefault();

            const employeeId = document.getElementById('employeeId').value;
            const email = document.getElementById('email').value;

            if (!employeeId || !email) {
                alert('Please fill in all required fields');
                return;
            }

            // Show loading state
            const button = event.target;
            button.innerHTML = '<span class="loading-spinner"></span><span>Sending...</span>';
            button.disabled = true;

            // Send password reset request
            fetch('/api/auth/forgot-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    employeeId,
                    email
                })
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // Show success message
                        document.querySelector('.container').innerHTML = `
                <img src="/logo/with-text.jpeg" alt="AssetCare360 Logo" class="welcome-img" />
                <div class="welcome-text">Password Reset Email Sent</div>
                <div class="success-message">
                    <p>We've sent a password reset link to your email address. Please check your inbox and follow the instructions to reset your password.</p>
                </div>
                <div class="forgot-password">
                    <a href="/login">Back to Login</a>
                </div>
                <div class="footer">
                    © 2025 AssetCare360. All rights reserved.
                </div>
            `;
                    } else {
                        // Show error message
                        alert(data.message || 'An error occurred. Please try again.');

                        // Reset button state
                        button.innerHTML = 'Send Reset Link';
                        button.disabled = false;
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred. Please try again.');

                    // Reset button state
                    button.innerHTML = 'Send Reset Link';
                    button.disabled = false;
                });
        }
    </script>
</body>

</html>
