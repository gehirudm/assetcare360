<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssetCare360 - Forgot Password</title>
    
    <!-- Config and Helper Scripts -->
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/utils.js"></script>
    
    <style>
        :root {
            --primary: #4a90e2;
            --primary-hover: #3a7bc8;
            --kelly-green: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
            opacity: 0.5;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            top: -300px;
            right: -300px;
            animation: float 20s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
        }

        .container {
            max-width: 420px;
            width: 100%;
            margin: 50px auto;
            padding: 40px;
            background-color: #fff;
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            position: relative;
            z-index: 2;
        }

        .logo-section {
            text-align: center;
            border-bottom: 1px solid #f3f4f6;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .brand-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 0.5rem;
        }

        .brand-highlight {
            color: var(--kelly-green);
        }

        .welcome-text {
            font-size: 1rem;
            font-weight: 600;
            color: #6b7280;
            margin-bottom: 1.5rem;
            text-align: center;
            line-height: 1.5;
        }

        .description {
            font-size: 0.875rem;
            color: #6b7280;
            margin-bottom: 2rem;
            text-align: center;
        }

        .login-form {
            text-align: left;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #374151;
            font-size: 0.875rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 1.5px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 0.875rem 1.5rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .login-btn:hover:not(:disabled) {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-btn.loading {
            position: relative;
            color: transparent;
            pointer-events: none;
        }

        .login-btn.loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            border: 2px solid transparent;
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .back-to-login {
            margin-top: 1.5rem;
            text-align: center;
        }

        .back-to-login a {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .back-to-login a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #f3f4f6;
            color: #6b7280;
            font-size: 0.875rem;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            display: none;
        }

        .alert.error {
            background-color: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .alert.success {
            background-color: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        .alert.show {
            display: block;
        }

        .form-group.error input {
            border-color: #ef4444;
        }

        .error-message {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 0.25rem;
            display: none;
        }

        .form-group.error .error-message {
            display: block;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo-section">
            <h1 class="brand-title">AssetCare<span class="brand-highlight">360</span></h1>
        </div>
        
        <div class="welcome-text">Reset Your Password</div>
        <div class="description">Enter your Employee ID and email address to receive a password reset link.</div>
        
        <!-- Alert Message -->
        <div id="alertMessage" class="alert"></div>
        
        <form id="forgotPasswordForm" class="login-form">
            <div class="form-group">
                <label for="employeeId">Employee ID</label>
                <input type="text" id="employeeId" name="employeeId" placeholder="Enter your employee ID" required>
                <div class="error-message">Please enter your employee ID</div>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
                <div class="error-message">Please enter a valid email address</div>
            </div>
            <button type="submit" class="login-btn">
                Send Reset Link
            </button>
        </form>
        <div class="back-to-login">
            <a href="./login.html">← Back to Login</a>
        </div>
        <div class="footer">
            © 2025 AssetCare360. All rights reserved.
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('forgotPasswordForm');
            const inputs = form.querySelectorAll('input');
            const submitBtn = form.querySelector('.login-btn');
            const alertMessage = document.getElementById('alertMessage');

            // Real-time validation
            inputs.forEach(input => {
                input.addEventListener('blur', validateField);
                input.addEventListener('input', clearError);
            });

            function showAlert(message, type) {
                alertMessage.textContent = message;
                alertMessage.className = `alert ${type} show`;
            }

            function validateField(e) {
                const field = e.target;
                const formGroup = field.closest('.form-group');
                formGroup.classList.remove('error');

                if (!field.value.trim()) {
                    formGroup.classList.add('error');
                    return false;
                }

                if (field.type === 'email' && !Utils.isValidEmail(field.value)) {
                    formGroup.classList.add('error');
                    return false;
                }

                return true;
            }

            function clearError(e) {
                const formGroup = e.target.closest('.form-group');
                formGroup.classList.remove('error');
                alertMessage.classList.remove('show');
            }

            // Form submission
            form.addEventListener('submit', async function (e) {
                e.preventDefault();

                // Validate all fields
                let isValid = true;
                inputs.forEach(input => {
                    if (!validateField({ target: input })) {
                        isValid = false;
                    }
                });

                if (!isValid) {
                    showAlert('Please fill in all fields correctly', 'error');
                    return;
                }

                const employeeId = document.getElementById('employeeId').value.trim();
                const email = document.getElementById('email').value.trim();

                // Show loading state
                submitBtn.classList.add('loading');
                submitBtn.disabled = true;

                try {
                    const result = await Auth.requestPasswordReset(employeeId, email);

                    if (result.success) {
                        // Show success message
                        const container = document.querySelector('.container');
                        container.innerHTML = `
                            <div class="logo-section">
                                <h1 class="brand-title">AssetCare<span class="brand-highlight">360</span></h1>
                            </div>
                            <div class="welcome-text">Check Your Email</div>
                            <div class="alert success show">
                                <p>${result.message}</p>
                                <p style="margin-top: 0.5rem;">If you don't see the email, please check your spam folder.</p>
                            </div>
                            <div class="back-to-login">
                                <a href="./login.html">← Back to Login</a>
                            </div>
                            <div class="footer">
                                © 2025 AssetCare360. All rights reserved.
                            </div>
                        `;
                    } else {
                        showAlert(result.message || 'Failed to send reset email. Please try again.', 'error');
                        submitBtn.classList.remove('loading');
                        submitBtn.disabled = false;
                    }
                } catch (error) {
                    console.error('Error:', error);
                    showAlert('An error occurred. Please try again.', 'error');
                    submitBtn.classList.remove('loading');
                    submitBtn.disabled = false;
                }
            });

            // Auto-focus first input
            inputs[0].focus();
        });
    </script>
</body>

</html>
