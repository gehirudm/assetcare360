<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssetCare360 - Reset Password</title>
    
    <!-- Config and Helper Scripts -->
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/utils.js"></script>
    
    <style>
        :root {
            --primary: #4a90e2;
            --primary-hover: #3a7bc8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 420px;
            width: 100%;
            margin: 50px auto;
            padding: 40px;
            background-color: #fff;
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
        }

        .logo-section {
            text-align: center;
            border-bottom: 1px solid #f3f4f6;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .brand-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 0.5rem;
        }

        .brand-highlight {
            color: var(--primary);
        }

        .welcome-text {
            font-size: 1rem;
            font-weight: 600;
            color: #6b7280;
            margin-bottom: 1.5rem;
            text-align: center;
            line-height: 1.5;
        }

        .description {
            font-size: 0.875rem;
            color: #6b7280;
            margin-bottom: 2rem;
            text-align: center;
        }

        .login-form {
            text-align: left;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #374151;
            font-size: 0.875rem;
        }

        .password-field {
            position: relative;
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 1.5px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6b7280;
            cursor: pointer;
            padding: 4px;
        }

        .password-toggle:hover {
            color: #374151;
        }

        .password-strength {
            margin-top: 0.5rem;
            font-size: 0.75rem;
        }

        .strength-meter {
            height: 4px;
            background: #e5e7eb;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 0.25rem;
        }

        .strength-bar {
            height: 100%;
            transition: all 0.3s ease;
            width: 0%;
        }

        .strength-weak .strength-bar {
            width: 33%;
            background: #ef4444;
        }

        .strength-medium .strength-bar {
            width: 66%;
            background: #f59e0b;
        }

        .strength-strong .strength-bar {
            width: 100%;
            background: #10b981;
        }

        .login-btn {
            width: 100%;
            padding: 0.875rem 1.5rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .login-btn:hover:not(:disabled) {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-btn.loading {
            position: relative;
            color: transparent;
            pointer-events: none;
        }

        .login-btn.loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            border: 2px solid transparent;
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .back-to-login {
            margin-top: 1.5rem;
            text-align: center;
        }

        .back-to-login a {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .back-to-login a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #f3f4f6;
            color: #6b7280;
            font-size: 0.875rem;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            display: none;
        }

        .alert.error {
            background-color: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .alert.success {
            background-color: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        .alert.show {
            display: block;
        }

        .form-group.error input {
            border-color: #ef4444;
        }

        .error-message {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 0.25rem;
            display: none;
        }

        .form-group.error .error-message {
            display: block;
        }

        .requirements {
            font-size: 0.75rem;
            color: #6b7280;
            margin-top: 0.5rem;
        }

        .requirements ul {
            list-style: none;
            padding-left: 0;
        }

        .requirements li {
            padding: 0.25rem 0;
        }

        .requirements li::before {
            content: '✓';
            margin-right: 0.5rem;
            color: #9ca3af;
        }

        .requirements li.valid::before {
            color: #10b981;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo-section">
            <h1 class="brand-title">AssetCare<span class="brand-highlight">360</span></h1>
        </div>
        
        <div class="welcome-text">Set New Password</div>
        <div class="description">Enter your new password below.</div>
        
        <!-- Alert Message -->
        <div id="alertMessage" class="alert"></div>
        
        <form id="resetPasswordForm" class="login-form">
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <div class="password-field">
                    <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('newPassword')">
                        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        </svg>
                    </button>
                </div>
                <div class="password-strength">
                    <div class="strength-meter">
                        <div class="strength-bar"></div>
                    </div>
                    <span class="strength-text"></span>
                </div>
                <div class="requirements">
                    <ul>
                        <li id="req-length">At least 6 characters</li>
                    </ul>
                </div>
                <div class="error-message">Please enter a valid password</div>
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="password-field">
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm new password" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')">
                        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        </svg>
                    </button>
                </div>
                <div class="error-message">Passwords do not match</div>
            </div>
            
            <button type="submit" class="login-btn">
                Reset Password
            </button>
        </form>
        
        <div class="back-to-login">
            <a href="./login.html">← Back to Login</a>
        </div>
        
        <div class="footer">
            © 2025 AssetCare360. All rights reserved.
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('resetPasswordForm');
            const newPasswordInput = document.getElementById('newPassword');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const submitBtn = form.querySelector('.login-btn');
            const alertMessage = document.getElementById('alertMessage');
            
            // Get token from URL
            const token = Utils.getQueryParam('token');
            
            if (!token) {
                showAlert('Invalid or missing reset token. Please request a new password reset link.', 'error');
                submitBtn.disabled = true;
                return;
            }

            // Password strength checker
            newPasswordInput.addEventListener('input', function() {
                checkPasswordStrength(this.value);
            });

            function checkPasswordStrength(password) {
                const strengthMeter = document.querySelector('.password-strength');
                const strengthBar = document.querySelector('.strength-bar');
                const strengthText = document.querySelector('.strength-text');
                const reqLength = document.getElementById('req-length');
                
                const length = password.length;
                
                // Check requirements
                if (length >= 6) {
                    reqLength.classList.add('valid');
                } else {
                    reqLength.classList.remove('valid');
                }
                
                // Calculate strength
                let strength = 0;
                if (length >= 6) strength++;
                if (length >= 10) strength++;
                if (/[A-Z]/.test(password)) strength++;
                if (/[0-9]/.test(password)) strength++;
                if (/[^A-Za-z0-9]/.test(password)) strength++;
                
                // Update display
                strengthMeter.className = 'password-strength';
                if (strength >= 1 && strength <= 2) {
                    strengthMeter.classList.add('strength-weak');
                    strengthText.textContent = 'Weak';
                    strengthText.style.color = '#ef4444';
                } else if (strength >= 3 && strength <= 4) {
                    strengthMeter.classList.add('strength-medium');
                    strengthText.textContent = 'Medium';
                    strengthText.style.color = '#f59e0b';
                } else if (strength >= 5) {
                    strengthMeter.classList.add('strength-strong');
                    strengthText.textContent = 'Strong';
                    strengthText.style.color = '#10b981';
                }
            }

            function showAlert(message, type) {
                alertMessage.textContent = message;
                alertMessage.className = `alert ${type} show`;
            }

            function validatePassword(password) {
                return password.length >= 6;
            }

            function validateForm() {
                let isValid = true;
                
                // Clear previous errors
                document.querySelectorAll('.form-group').forEach(group => {
                    group.classList.remove('error');
                });
                
                const newPassword = newPasswordInput.value;
                const confirmPassword = confirmPasswordInput.value;
                
                // Validate new password
                if (!validatePassword(newPassword)) {
                    newPasswordInput.closest('.form-group').classList.add('error');
                    isValid = false;
                }
                
                // Validate password match
                if (newPassword !== confirmPassword) {
                    confirmPasswordInput.closest('.form-group').classList.add('error');
                    isValid = false;
                }
                
                return isValid;
            }

            // Clear errors on input
            [newPasswordInput, confirmPasswordInput].forEach(input => {
                input.addEventListener('input', function() {
                    this.closest('.form-group').classList.remove('error');
                    alertMessage.classList.remove('show');
                });
            });

            // Form submission
            form.addEventListener('submit', async function (e) {
                e.preventDefault();

                if (!validateForm()) {
                    showAlert('Please fix the errors and try again', 'error');
                    return;
                }

                const newPassword = newPasswordInput.value;

                // Show loading state
                submitBtn.classList.add('loading');
                submitBtn.disabled = true;

                try {
                    const response = await API.post('/auth/reset-password', {
                        token: token,
                        new_password: newPassword
                    }, { skipAuth: true });

                    // Backend returns {status: 'success', message: '...', data: {...}}
                    if (response.status === 'success') {
                        // Show success message
                        const container = document.querySelector('.container');
                        container.innerHTML = `
                            <div class="logo-section">
                                <h1 class="brand-title">AssetCare<span class="brand-highlight">360</span></h1>
                            </div>
                            <div class="welcome-text">Password Reset Successful</div>
                            <div class="alert success show">
                                <p>${response.message}</p>
                            </div>
                            <div class="back-to-login">
                                <a href="./login.html">← Proceed to Login</a>
                            </div>
                            <div class="footer">
                                © 2025 AssetCare360. All rights reserved.
                            </div>
                        `;
                        
                        // Auto redirect after 3 seconds
                        setTimeout(() => {
                            window.location.href = './login.html';
                        }, 3000);
                    } else {
                        showAlert(response.message || 'Failed to reset password. Please try again.', 'error');
                        submitBtn.classList.remove('loading');
                        submitBtn.disabled = false;
                    }
                } catch (error) {
                    console.error('Error:', error);
                    showAlert(error.message || 'An error occurred. Please try again.', 'error');
                    submitBtn.classList.remove('loading');
                    submitBtn.disabled = false;
                }
            });

            // Auto-focus first input
            newPasswordInput.focus();
        });

        function togglePassword(fieldId) {
            const passwordInput = document.getElementById(fieldId);
            const toggleBtn = passwordInput.nextElementSibling;

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.innerHTML = `
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
                    </svg>
                `;
            } else {
                passwordInput.type = 'password';
                toggleBtn.innerHTML = `
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                    </svg>
                `;
            }
        }
    </script>
</body>

</html>
