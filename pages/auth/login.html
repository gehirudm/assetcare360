<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssetCare360 - Login</title>

    <!-- Config and Helper Scripts -->
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/utils.js"></script>

    <style>
        :root {
            --primary: #4a90e2;
            --primary-hover: #3a7bc8;
            --kelly-green: #10b981;
            --royal-blue: #1e40af;
            --royal-blue-2: #1e3a8a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 2rem 0;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
            opacity: 0.5;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            top: -300px;
            right: -300px;
            animation: float 20s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) rotate(0deg);
            }

            33% {
                transform: translate(30px, -30px) rotate(120deg);
            }

            66% {
                transform: translate(-20px, 20px) rotate(240deg);
            }
        }

        .login-container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            padding: 3rem;
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 2;
        }

        .logo-section {
            text-align: center;
            border-bottom: 1px solid #f3f4f6;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.3);
        }

        .logo-icon svg {
            width: 32px;
            height: 32px;
            color: white;
        }

        .brand-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }

        .brand-highlight {
            color: var(--kelly-green);
        }

        .welcome-text {
            font-size: 1rem;
            color: #6b7280;
            margin-bottom: 2rem;
            line-height: 1.5;
            font-weight: 600;
            text-align: center;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-weight: 500;
            color: #374151;
            font-size: 0.875rem;
        }

        .form-group input {
            padding: 0.875rem 1rem;
            border: 1.5px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s ease;
            background: #ffffff;
            color: #1f2937;
            width: 100%
        }

        .form-group input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .form-group input::placeholder {
            color: #9ca3af;
        }

        .password-field {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6b7280;
            cursor: pointer;
            padding: 4px;
        }

        .password-toggle:hover {
            color: #374151;
        }

        .forgot-password-link {
            align-self: flex-end;
            margin-top: -0.5rem;
            margin-bottom: 0.5rem;
        }

        .forgot-password-link a {
            color: #6366f1;
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .forgot-password-link a:hover {
            text-decoration: underline;
        }

        .login-btn {
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 0.875rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .login-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn.loading {
            pointer-events: none;
            opacity: 0.8;
            color: transparent;
        }

        .login-btn.loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            border: 2px solid transparent;
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            display: none;
        }

        .alert.error {
            background-color: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .alert.success {
            background-color: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        .alert.show {
            display: block;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #f3f4f6;
            color: #6b7280;
            font-size: 0.875rem;
        }

        /* Error states */
        .form-group.error input {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }

        .error-message {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 0.25rem;
            display: none;
        }

        .form-group.error .error-message {
            display: block;
        }

        /* Success states */
        .form-group.success input {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        /* Passkey login styles */
        .login-divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: #9ca3af;
            font-size: 0.875rem;
        }

        .login-divider::before,
        .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }

        .login-divider span {
            padding: 0 1rem;
        }

        .passkey-login-btn {
            width: 100%;
            background: #1f2937;
            color: #ffffff;
            border: none;
            padding: 0.875rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .passkey-login-btn:hover {
            background: #374151;
            transform: translateY(-1px);
        }

        .passkey-login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .passkey-login-btn svg {
            flex-shrink: 0;
        }

        /* Inline passkey button under employee ID */
        .passkey-inline {
            margin-top: 0.75rem;
        }

        .passkey-inline .passkey-login-btn {
            padding: 0.625rem 1rem;
            font-size: 0.9rem;
            background: #1f2937;
        }

        .passkey-inline .passkey-login-btn:hover {
            background: #374151;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="logo-section">
            <h1 class="brand-title">AssetCare<span class="brand-highlight">360</span></h1>
        </div>

        <div class="welcome-text">
            Access your role-based dashboard.
        </div>

        <!-- Alert Message -->
        <div id="alertMessage" class="alert"></div>

        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="employeeId">Employee ID</label>
                <input type="text" id="employeeId" name="employeeId" placeholder="Enter your employee ID" required
                    autocomplete="username">
                <div class="error-message">Please enter a valid employee ID</div>

                <!-- Passkey Login Option (appears when employee ID is filled) -->
                <div id="passkeyLoginSection" class="passkey-inline" style="display: none;">
                    <button type="button" class="passkey-login-btn" onclick="loginWithPasskey()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                            fill="currentColor">
                            <path
                                d="M17.81 4.47c-.08 0-.16-.02-.23-.06C15.66 3.42 14 3 12.01 3c-1.98 0-3.86.47-5.57 1.41-.24.13-.54.04-.68-.2-.13-.24-.04-.55.2-.68C7.82 2.52 9.86 2 12.01 2c2.13 0 3.99.47 6.03 1.52.25.13.34.43.21.67-.09.18-.26.28-.44.28zM3.5 9.72c-.1 0-.2-.03-.29-.09-.23-.16-.28-.47-.12-.7.99-1.4 2.25-2.5 3.75-3.27C9.98 4.04 14 4.03 17.15 5.65c1.5.77 2.76 1.86 3.75 3.25.16.22.11.54-.12.7-.23.16-.54.11-.7-.12-.9-1.26-2.04-2.25-3.39-2.94-2.87-1.47-6.54-1.47-9.4.01-1.36.7-2.5 1.7-3.4 2.96-.08.14-.23.21-.39.21zm6.25 12.07c-.13 0-.26-.05-.35-.15-.87-.87-1.34-1.43-2.01-2.64-.69-1.23-1.05-2.73-1.05-4.34 0-2.97 2.54-5.39 5.66-5.39s5.66 2.42 5.66 5.39c0 .28-.22.5-.5.5s-.5-.22-.5-.5c0-2.42-2.09-4.39-4.66-4.39-2.57 0-4.66 1.97-4.66 4.39 0 1.44.32 2.77.93 3.85.64 1.15 1.08 1.64 1.85 2.42.19.2.19.51 0 .71-.11.1-.24.15-.37.15zm7.17-1.85c-1.19 0-2.24-.3-3.1-.89-1.49-1.01-2.38-2.65-2.38-4.39 0-.28.22-.5.5-.5s.5.22.5.5c0 1.41.72 2.74 1.94 3.56.71.48 1.54.71 2.54.71.24 0 .64-.03 1.04-.1.27-.05.53.13.58.41.05.27-.13.53-.41.58-.57.11-1.07.12-1.21.12zM14.91 22c-.04 0-.09-.01-.13-.02-1.59-.44-2.63-1.03-3.72-2.1-1.4-1.39-2.17-3.24-2.17-5.22 0-1.62 1.38-2.94 3.08-2.94 1.7 0 3.08 1.32 3.08 2.94 0 1.07.93 1.94 2.08 1.94s2.08-.87 2.08-1.94c0-3.77-3.25-6.83-7.25-6.83-2.84 0-5.44 1.58-6.61 4.03-.39.81-.59 1.76-.59 2.8 0 .78.07 2.01.67 3.61.1.26-.03.55-.29.64-.26.1-.55-.04-.64-.29-.49-1.31-.73-2.61-.73-3.96 0-1.2.23-2.29.68-3.24 1.33-2.79 4.28-4.6 7.51-4.6 4.55 0 8.25 3.51 8.25 7.83 0 1.62-1.38 2.94-3.08 2.94s-3.08-1.32-3.08-2.94c0-1.07-.93-1.94-2.08-1.94s-2.08.87-2.08 1.94c0 1.71.66 3.31 1.87 4.51.95.94 1.86 1.46 3.27 1.85.27.07.42.35.35.61-.05.23-.26.38-.47.38z" />
                        </svg>
                        Sign in with Passkey
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-field">
                    <input type="password" id="password" name="password" placeholder="Enter your password" required
                        autocomplete="current-password">
                    <button type="button" class="password-toggle" onclick="togglePassword()">
                        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" />
                        </svg>
                    </button>
                </div>
                <div class="error-message">Please enter your password</div>
            </div>
            <div class="forgot-password-link">
                <a href="../auth/forgot-password.html">Forgot password?</a>
            </div>

            <button type="submit" class="login-btn">
                Log in
            </button>
        </form>

        <div class="footer">
            © 2025 AssetCare360. All rights reserved.
        </div>
    </div>

    <script>
        // Enhanced form validation and user experience
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('loginForm');
            const inputs = form.querySelectorAll('input');
            const loginBtn = form.querySelector('.login-btn');
            const alertMessage = document.getElementById('alertMessage');

            // Real-time validation
            inputs.forEach(input => {
                input.addEventListener('blur', validateField);
                input.addEventListener('input', clearError);
            });

            function showAlert(message, type) {
                alertMessage.textContent = message;
                alertMessage.className = `alert ${type} show`;

                if (type === 'success') {
                    setTimeout(() => {
                        alertMessage.classList.remove('show');
                    }, 3000);
                }
            }

            function validateField(e) {
                const field = e.target;
                const formGroup = field.closest('.form-group');

                formGroup.classList.remove('error', 'success');

                if (!field.value.trim()) {
                    formGroup.classList.add('error');
                    return false;
                }

                if (field.name === 'employeeId' && field.value.trim().length < 3) {
                    formGroup.classList.add('error');
                    return false;
                }

                if (field.name === 'password' && field.value.length < 6) {
                    formGroup.classList.add('error');
                    return false;
                }

                formGroup.classList.add('success');
                return true;
            }

            function clearError(e) {
                const formGroup = e.target.closest('.form-group');
                formGroup.classList.remove('error');
                alertMessage.classList.remove('show');
            }

            // Form submission with loading state
            form.addEventListener('submit', async function (e) {
                e.preventDefault();

                let isValid = true;
                inputs.forEach(input => {
                    if (!validateField({ target: input })) {
                        isValid = false;
                    }
                });

                if (!isValid) {
                    showAlert('Please fill in all required fields correctly', 'error');
                    return;
                }

                const employeeId = document.getElementById('employeeId').value.trim();
                const password = document.getElementById('password').value;

                // Show loading state
                loginBtn.classList.add('loading');
                loginBtn.disabled = true;

                try {
                    const result = await Auth.login(employeeId, password);

                    console.log('Login result:', result);

                    if (result.success) {
                        // Check if password change is required
                        if (result.forcePasswordChange) {
                            showAlert('Password change required. Redirecting...', 'success');
                            // Redirect to change password page after short delay
                            setTimeout(() => {
                                window.location.href = './change-password.html';
                            }, 1000);
                            return;
                        }

                        showAlert(result.message || 'Login successful! Redirecting...', 'success');

                        console.log('Login successful, redirecting user:', result.user);

                        // Redirect to dashboard
                        Auth.redirectToDashboard(result.user);
                    } else {
                        showAlert(result.message || 'Login failed. Please try again.', 'error');
                        loginBtn.classList.remove('loading');
                        loginBtn.disabled = false;
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    showAlert('An error occurred. Please try again.', 'error');
                    loginBtn.classList.remove('loading');
                    loginBtn.disabled = false;
                }
            });

            // Keyboard navigation enhancement
            inputs.forEach((input, index) => {
                input.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        if (index < inputs.length - 1) {
                            inputs[index + 1].focus();
                        } else {
                            form.dispatchEvent(new Event('submit'));
                        }
                    }
                });
            });

            // Auto-focus first input
            inputs[0].focus();
        });

        // Password toggle functionality
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.querySelector('.password-toggle');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.innerHTML = `
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
                    </svg>
                `;
            } else {
                passwordInput.type = 'password';
                toggleBtn.innerHTML = `
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                    </svg>
                `;
            }
        }
    </script>

    <!-- Passkey Support -->
    <script src="../js/passkey.js"></script>
    <script>
        // Check for passkey support and set up input listener
        document.addEventListener('DOMContentLoaded', function () {
            const passkeySection = document.getElementById('passkeyLoginSection');
            const employeeIdInput = document.getElementById('employeeId');

            if (typeof Passkey !== 'undefined' && Passkey.isSupported() && passkeySection && employeeIdInput) {
                // Show/hide passkey button based on employee ID input
                function updatePasskeyVisibility() {
                    if (employeeIdInput.value.trim().length > 0) {
                        passkeySection.style.display = 'block';
                    } else {
                        passkeySection.style.display = 'none';
                    }
                }

                // Listen for input changes
                employeeIdInput.addEventListener('input', updatePasskeyVisibility);
                employeeIdInput.addEventListener('change', updatePasskeyVisibility);

                // Check initial value (in case of autofill)
                updatePasskeyVisibility();
            }
        });

        // Login with passkey
        async function loginWithPasskey() {
            const passkeyBtn = document.querySelector('.passkey-login-btn');
            const alertMessage = document.getElementById('alertMessage');

            // Get employee ID
            const employeeId = document.getElementById('employeeId').value.trim() ||
                prompt('Enter your Employee ID to sign in with passkey:');

            if (!employeeId) {
                showAlertPasskey('Please enter your Employee ID', 'error');
                return;
            }

            const originalHTML = passkeyBtn ? passkeyBtn.innerHTML : '';

            if (passkeyBtn) {
                passkeyBtn.disabled = true;
                passkeyBtn.innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="animation: spin 1s linear infinite;">
                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none" stroke-dasharray="31.4" stroke-dashoffset="10"/>
                    </svg>
                    Signing in...
                `;
            }

            try {
                // Get authentication options from server
                const optionsResponse = await API.post('/auth/passkey/authenticate-options', {
                    employee_id: employeeId
                }, { skipAuth: true });

                if (optionsResponse.status !== 'success') {
                    throw new Error(optionsResponse.message || 'Failed to get authentication options');
                }

                // Authenticate using WebAuthn
                const credential = await Passkey.authenticate(optionsResponse.data);

                // Send credential to server
                const authResponse = await API.post('/auth/passkey/authenticate', {
                    response: credential
                }, { skipAuth: true });

                if (authResponse.status === 'success') {
                    // Store token and user data
                    localStorage.setItem(CONFIG.STORAGE_KEYS.AUTH_TOKEN, authResponse.data.token);
                    localStorage.setItem(CONFIG.STORAGE_KEYS.USER_DATA, JSON.stringify(authResponse.data.user));

                    showAlertPasskey('Login successful! Redirecting...', 'success');

                    // Redirect to dashboard
                    Auth.redirectToDashboard(authResponse.data.user);
                } else {
                    throw new Error(authResponse.message || 'Authentication failed');
                }

            } catch (error) {
                console.error('Passkey authentication error:', error);
                showAlertPasskey(Passkey.getErrorMessage ? Passkey.getErrorMessage(error) : error.message, 'error');
            } finally {
                if (passkeyBtn) {
                    passkeyBtn.disabled = false;
                    passkeyBtn.innerHTML = originalHTML;
                }
            }
        }

        // Helper function for passkey alerts
        function showAlertPasskey(message, type) {
            const alertMessage = document.getElementById('alertMessage');
            if (alertMessage) {
                alertMessage.textContent = message;
                alertMessage.className = `alert ${type} show`;

                if (type === 'success') {
                    setTimeout(() => {
                        alertMessage.classList.remove('show');
                    }, 3000);
                }
            }
        }
    </script>
</body>

</html>
