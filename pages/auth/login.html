<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssetCare360 - Login</title>
    
    <!-- Config and Helper Scripts -->
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/utils.js"></script>
    
    <style>
        :root {
            --primary: #4a90e2;
            --primary-hover: #3a7bc8;
            --kelly-green: #10b981;
            --royal-blue: #1e40af;
            --royal-blue-2: #1e3a8a;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 2rem 0;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
            opacity: 0.5;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            top: -300px;
            right: -300px;
            animation: float 20s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(30px, -30px) rotate(120deg); }
            66% { transform: translate(-20px, 20px) rotate(240deg); }
        }

        .login-container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            padding: 3rem;
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 2;
        }

        .logo-section {
            text-align: center;
            border-bottom: 1px solid #f3f4f6;
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.3);
        }

        .logo-icon svg {
            width: 32px;
            height: 32px;
            color: white;
        }

        .brand-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }

        .brand-highlight {
            color: var(--kelly-green);
        }

        .welcome-text {
            font-size: 1rem;
            color: #6b7280;
            margin-bottom: 2rem;
            line-height: 1.5;
            font-weight: 600;
            text-align: center;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-weight: 500;
            color: #374151;
            font-size: 0.875rem;
        }

        .form-group input {
            padding: 0.875rem 1rem;
            border: 1.5px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s ease;
            background: #ffffff;
            color: #1f2937;
            width: 100%
        }

        .form-group input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .form-group input::placeholder {
            color: #9ca3af;
        }

        .password-field {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6b7280;
            cursor: pointer;
            padding: 4px;
        }

        .password-toggle:hover {
            color: #374151;
        }

        .forgot-password-link {
            align-self: flex-end;
            margin-top: -0.5rem;
            margin-bottom: 0.5rem;
        }

        .forgot-password-link a {
            color: #6366f1;
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .forgot-password-link a:hover {
            text-decoration: underline;
        }

        .login-btn {
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 0.875rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .login-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn.loading {
            pointer-events: none;
            opacity: 0.8;
            color: transparent;
        }

        .login-btn.loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            border: 2px solid transparent;
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            display: none;
        }

        .alert.error {
            background-color: #fee;
            color: #c33;
            border: 1px solid #fcc;
        }

        .alert.success {
            background-color: #efe;
            color: #3c3;
            border: 1px solid #cfc;
        }

        .alert.show {
            display: block;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .footer {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #f3f4f6;
            color: #6b7280;
            font-size: 0.875rem;
        }

        /* Error states */
        .form-group.error input {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }

        .error-message {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 0.25rem;
            display: none;
        }

        .form-group.error .error-message {
            display: block;
        }

        /* Success states */
        .form-group.success input {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="logo-section">
            <h1 class="brand-title">AssetCare<span class="brand-highlight">360</span></h1>
        </div>

        <div class="welcome-text">
            Access your role-based dashboard.
        </div>

        <!-- Alert Message -->
        <div id="alertMessage" class="alert"></div>

        <form id="loginForm" class="login-form">
            <div class="form-group">
                <label for="employeeId">Employee ID</label>
                <input type="text" id="employeeId" name="employeeId" placeholder="Enter your employee ID" required autocomplete="username">
                <div class="error-message">Please enter a valid employee ID</div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-field">
                    <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                    <button type="button" class="password-toggle" onclick="togglePassword()">
                        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                            <path
                                d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" />
                        </svg>
                    </button>
                </div>
                <div class="error-message">Please enter your password</div>
            </div>
            <div class="forgot-password-link">
                <a href="../auth/forgot-password.html">Forgot password?</a>
            </div>

            <button type="submit" class="login-btn">
                Log in
            </button>
        </form>

        <div class="footer">
            © 2025 AssetCare360. All rights reserved.
        </div>
    </div>

    <script>
        // Enhanced form validation and user experience
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('loginForm');
            const inputs = form.querySelectorAll('input');
            const loginBtn = form.querySelector('.login-btn');
            const alertMessage = document.getElementById('alertMessage');

            // Check if already logged in
            checkExistingSession();

            // Real-time validation
            inputs.forEach(input => {
                input.addEventListener('blur', validateField);
                input.addEventListener('input', clearError);
            });

            async function checkExistingSession() {
                const user = await Auth.checkAuth();
                if (user) {
                    // User is already logged in, redirect to their dashboard
                    Auth.redirectToDashboard(user);
                }
                // If user is null, they're not logged in - stay on login page (expected behavior)
            }

            function showAlert(message, type) {
                alertMessage.textContent = message;
                alertMessage.className = `alert ${type} show`;
                
                if (type === 'success') {
                    setTimeout(() => {
                        alertMessage.classList.remove('show');
                    }, 3000);
                }
            }

            function validateField(e) {
                const field = e.target;
                const formGroup = field.closest('.form-group');

                formGroup.classList.remove('error', 'success');

                if (!field.value.trim()) {
                    formGroup.classList.add('error');
                    return false;
                }

                if (field.name === 'employeeId' && field.value.trim().length < 3) {
                    formGroup.classList.add('error');
                    return false;
                }

                if (field.name === 'password' && field.value.length < 6) {
                    formGroup.classList.add('error');
                    return false;
                }

                formGroup.classList.add('success');
                return true;
            }

            function clearError(e) {
                const formGroup = e.target.closest('.form-group');
                formGroup.classList.remove('error');
                alertMessage.classList.remove('show');
            }

            // Form submission with loading state
            form.addEventListener('submit', async function (e) {
                e.preventDefault();

                let isValid = true;
                inputs.forEach(input => {
                    if (!validateField({ target: input })) {
                        isValid = false;
                    }
                });

                if (!isValid) {
                    showAlert('Please fill in all required fields correctly', 'error');
                    return;
                }

                const employeeId = document.getElementById('employeeId').value.trim();
                const password = document.getElementById('password').value;

                // Show loading state
                loginBtn.classList.add('loading');
                loginBtn.disabled = true;

                try {
                    const result = await Auth.login(employeeId, password);
                    
                    console.log('Login result:', result);

                    if (result.success) {
                        // Check if password change is required
                        if (result.forcePasswordChange) {
                            showAlert('Password change required. Redirecting...', 'success');
                            // Redirect to change password page after short delay
                            setTimeout(() => {
                                window.location.href = './change-password.html';
                            }, 1000);
                            return;
                        }
                        
                        showAlert(result.message || 'Login successful! Redirecting...', 'success');
                        
                        console.log('Login successful, redirecting user:', result.user);
                        
                        // Redirect to dashboard
                        Auth.redirectToDashboard(result.user);
                    } else {
                        showAlert(result.message || 'Login failed. Please try again.', 'error');
                        loginBtn.classList.remove('loading');
                        loginBtn.disabled = false;
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    showAlert('An error occurred. Please try again.', 'error');
                    loginBtn.classList.remove('loading');
                    loginBtn.disabled = false;
                }
            });

            // Keyboard navigation enhancement
            inputs.forEach((input, index) => {
                input.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        if (index < inputs.length - 1) {
                            inputs[index + 1].focus();
                        } else {
                            form.dispatchEvent(new Event('submit'));
                        }
                    }
                });
            });

            // Auto-focus first input
            inputs[0].focus();
        });

        // Password toggle functionality
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.querySelector('.password-toggle');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.innerHTML = `
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
                    </svg>
                `;
            } else {
                passwordInput.type = 'password';
                toggleBtn.innerHTML = `
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                    </svg>
                `;
            }
        }
    </script>
</body>

</html>
