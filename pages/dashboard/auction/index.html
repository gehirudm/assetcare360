<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auction Officer Dashboard</title>

    <!-- Config must load first -->
    <script src="../../js/config.js"></script>

    <!-- Icons -->
    <script src="https://kit.fontawesome.com/a422e631ad.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <ac-layout
        title="Auction Officer Dashboard"
        icon="fa-gavel"
        active-section="dashboard"
        nav='[
            {"section":"dashboard","icon":"fas fa-chart-bar","label":"Dashboard"},
            {"section":"active-auctions","icon":"fas fa-gavel","label":"Active Auctions"},
            {"section":"assets","icon":"fas fa-truck","label":"Assets for Auction"},
            {"section":"bidders","icon":"fas fa-users","label":"Bidder Management"},
            {"section":"schedule","icon":"fas fa-calendar-alt","label":"Auction Schedule"},
            {"section":"reports","icon":"fas fa-chart-line","label":"Reports"}
        ]'>
        <section class="content-section" id="dashboard">
            <auction-dashboard-overview></auction-dashboard-overview>
        </section>
        <section class="content-section" id="active-auctions">
            <auction-active-auctions></auction-active-auctions>
        </section>
        <section class="content-section" id="assets">
            <auction-assets></auction-assets>
        </section>
        <section class="content-section" id="bidders">
            <auction-bidders></auction-bidders>
        </section>
        <section class="content-section" id="schedule">
            <auction-schedule></auction-schedule>
        </section>
        <section class="content-section" id="reports">
            <auction-reports></auction-reports>
        </section>
    </ac-layout>

    <auction-create-auction-modal></auction-create-auction-modal>
    <auction-register-bidder-modal></auction-register-bidder-modal>
    <auction-schedule-auction-modal></auction-schedule-auction-modal>
    <auction-details-modal></auction-details-modal>
    <auction-bidders-modal></auction-bidders-modal>

    <div id="toast" class="toast"></div>

    <!-- Shared Components -->
    <confirm-dialog></confirm-dialog>

    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../components/shared/ac-header.js"></script>
    <script src="../../components/shared/ac-sidebar.js"></script>
    <script src="../../components/shared/ac-layout.js"></script>
    <script src="../../components/styles/buttons.js"></script>
    <script src="../../components/styles/icons.js"></script>
    <script src="../../components/shared/confirm-dialog.js"></script>
    <script src="./components/dashboard-overview.js"></script>
    <script src="./components/active-auctions.js"></script>
    <script src="./components/assets.js"></script>
    <script src="./components/bidders.js"></script>
    <script src="./components/schedule.js"></script>
    <script src="./components/reports.js"></script>
    <script src="./components/page-modals/create-auction-modal.js"></script>
    <script src="./components/page-modals/register-bidder-modal.js"></script>
    <script src="./components/page-modals/schedule-auction-modal.js"></script>
    <script src="./components/page-modals/auction-details-modal.js"></script>
    <script src="./components/page-modals/auction-bidders-modal.js"></script>
    <script src="../../js/dashboard-init.js"></script>
    <script src="script.js"></script>
</body>
</html>
