<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Dashboard - AssetCare360</title>

    <script src="../../js/config.js"></script>
    <script src="https://kit.fontawesome.com/a422e631ad.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <ac-layout
        title="Driver Dashboard"
        icon="fa-steering-wheel"
        active-section="dashboard"
        nav='[
            {"section":"dashboard","icon":"fas fa-tachometer-alt","label":"Dashboard"},
            {"section":"analytics","icon":"fas fa-chart-line","label":"Analytics"},
            {"section":"trip-log","icon":"fas fa-route","label":"Trip Log"},
            {"section":"vehicle-check","icon":"fas fa-clipboard-check","label":"Vehicle Check"},
            {"section":"breakdown","icon":"fas fa-exclamation-triangle","label":"Breakdown Report"},
            {"section":"ticket-tracking","icon":"fas fa-ticket-alt","label":"Ticket Tracking"},
            {"section":"fuel-mileage","icon":"fas fa-gas-pump","label":"Fuel & Mileage"},
            {"section":"transport-ticket","icon":"fas fa-ticket-alt","label":"Transport Ticket"},
            {"section":"garages","icon":"fas fa-warehouse","label":"Nearby Garages"}
        ]'>
        <section class="content-section active" id="dashboard">
            <driver-dashboard-overview></driver-dashboard-overview>
        </section>

        <section class="content-section" id="analytics">
            <driver-analytics-hub></driver-analytics-hub>
        </section>

        <section class="content-section" id="trip-log">
            <driver-trip-log></driver-trip-log>
        </section>

        <section class="content-section" id="vehicle-check">
            <driver-vehicle-check></driver-vehicle-check>
        </section>

        <section class="content-section" id="breakdown">
            <driver-breakdown></driver-breakdown>
        </section>

        <section class="content-section" id="ticket-tracking">
            <driver-ticket-tracking></driver-ticket-tracking>
        </section>

        <section class="content-section" id="fuel-mileage">
            <driver-fuel-mileage></driver-fuel-mileage>
        </section>

        <section class="content-section" id="transport-ticket">
            <driver-transport-ticket></driver-transport-ticket>
        </section>

        <section class="content-section" id="garages">
            <driver-garages></driver-garages>
        </section>
    </ac-layout>

    <driver-start-trip-modal></driver-start-trip-modal>
    <driver-end-trip-modal></driver-end-trip-modal>
    <driver-view-trip-modal></driver-view-trip-modal>
    <driver-edit-trip-modal></driver-edit-trip-modal>
    <driver-reject-trip-modal></driver-reject-trip-modal>
    <driver-start-accepted-trip-modal></driver-start-accepted-trip-modal>
    <driver-daily-check-modal></driver-daily-check-modal>
    <driver-breakdown-modal></driver-breakdown-modal>
    <driver-breakdown-in-route-modal></driver-breakdown-in-route-modal>
    <driver-breakdown-details-modal></driver-breakdown-details-modal>
    <driver-technician-tracking-modal></driver-technician-tracking-modal>
    <driver-nearby-garages-modal></driver-nearby-garages-modal>
    <driver-garage-progress-modal></driver-garage-progress-modal>
    <driver-complete-breakdown-modal></driver-complete-breakdown-modal>
    <driver-fuel-mileage-modal></driver-fuel-mileage-modal>
    <driver-transport-ticket-modal></driver-transport-ticket-modal>
    <driver-ticket-details-modal></driver-ticket-details-modal>
    <driver-trip-details-modal></driver-trip-details-modal>
    <driver-check-details-modal></driver-check-details-modal>

    <div id="toast" class="toast"></div>

    <confirm-dialog></confirm-dialog>

    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../../components/shared/ac-header.js"></script>
    <script src="../../components/shared/ac-sidebar.js"></script>
    <script src="../../components/shared/ac-layout.js"></script>
    <script src="../../components/styles/buttons.js"></script>
    <script src="../../components/styles/icons.js"></script>
    <script src="../../components/shared/confirm-dialog.js"></script>

    <script src="./components/driver-utils.js"></script>
    <script src="./components/driver-dashboard-overview.js"></script>
    <script src="./components/analytics-hub/script.js"></script>
    <script src="./components/driver-trip-log.js"></script>
    <script src="./components/driver-vehicle-check.js"></script>
    <script src="./components/driver-breakdown.js"></script>
    <script src="./components/driver-ticket-tracking.js"></script>
    <script src="./components/driver-fuel-mileage.js"></script>
    <script src="./components/driver-transport-ticket.js"></script>
    <script src="./components/driver-garages.js"></script>

    <script src="./components/page-modals/driver-start-trip-modal.js"></script>
    <script src="./components/page-modals/driver-end-trip-modal.js"></script>
    <script src="./components/page-modals/driver-view-trip-modal.js"></script>
    <script src="./components/page-modals/driver-edit-trip-modal.js"></script>
    <script src="./components/page-modals/driver-reject-trip-modal.js"></script>
    <script src="./components/page-modals/driver-start-accepted-trip-modal.js"></script>
    <script src="./components/page-modals/driver-daily-check-modal.js"></script>
    <script src="./components/page-modals/driver-breakdown-modal.js"></script>
    <script src="./components/page-modals/driver-breakdown-in-route-modal.js"></script>
    <script src="./components/page-modals/driver-breakdown-details-modal.js"></script>
    <script src="./components/page-modals/driver-technician-tracking-modal.js"></script>
    <script src="./components/page-modals/driver-nearby-garages-modal.js"></script>
    <script src="./components/page-modals/driver-garage-progress-modal.js"></script>
    <script src="./components/page-modals/driver-complete-breakdown-modal.js"></script>
    <script src="./components/page-modals/driver-fuel-mileage-modal.js"></script>
    <script src="./components/page-modals/driver-transport-ticket-modal.js"></script>
    <script src="./components/page-modals/driver-ticket-details-modal.js"></script>
    <script src="./components/page-modals/driver-trip-details-modal.js"></script>
    <script src="./components/page-modals/driver-check-details-modal.js"></script>

    <script src="../../js/dashboard-init.js"></script>
    <script src="script.js"></script>
</body>
</html>
