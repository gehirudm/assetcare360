<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transportation Manager Dashboard - AssetCare360</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <ac-layout
        title="Transportation Manager Dashboard"
        icon="fa-route"
        active-section="dashboard"
        nav='[
            {"section":"dashboard","icon":"fas fa-chart-line","label":"Dashboard"},
            {"section":"driver-assignment","icon":"fas fa-user-cog","label":"Driver Assignment"},
            {"section":"trips","icon":"fas fa-route","label":"Trips"},
            {"section":"trip-log","icon":"fas fa-history","label":"Trip Log"},
            {"section":"fuel-log","icon":"fas fa-gas-pump","label":"Fuel Log"},
            {"section":"garages","icon":"fas fa-warehouse","label":"Garages"},
            {"section":"fleet","icon":"fas fa-truck","label":"Fleet"}
        ]'>
        <section class="content-section active" id="dashboard">
            <tm-dashboard-overview></tm-dashboard-overview>
        </section>

        <section class="content-section" id="driver-assignment">
            <tm-driver-assignment></tm-driver-assignment>
        </section>

        <section class="content-section" id="trips">
            <tm-trips></tm-trips>
        </section>

        <section class="content-section" id="trip-log">
            <tm-trip-log></tm-trip-log>
        </section>

        <section class="content-section" id="fuel-log">
            <tm-fuel-log></tm-fuel-log>
        </section>

        <section class="content-section" id="garages">
            <tm-garages></tm-garages>
        </section>

        <section class="content-section" id="fleet">
            <tm-fleet></tm-fleet>
        </section>

        <section class="content-section" id="fleet-details">
            <tm-fleet-details></tm-fleet-details>
        </section>
    </ac-layout>

    <tm-assign-trip-modal></tm-assign-trip-modal>
    <tm-edit-trip-modal></tm-edit-trip-modal>
    <tm-assign-driver-modal></tm-assign-driver-modal>
    <tm-end-trip-modal></tm-end-trip-modal>
    <tm-add-fuel-log-modal></tm-add-fuel-log-modal>
    <tm-add-garage-modal></tm-add-garage-modal>
    <tm-view-trip-modal></tm-view-trip-modal>
    <tm-view-fuel-modal></tm-view-fuel-modal>

    <div id="toast" class="toast"></div>

    <confirm-dialog></confirm-dialog>

    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../components/shared/ac-header.js"></script>
    <script src="../../components/shared/ac-sidebar.js"></script>
    <script src="../../components/shared/ac-layout.js"></script>
    <script src="../../components/styles/buttons.js"></script>
    <script src="../../components/styles/icons.js"></script>
    <script src="../../components/shared/confirm-dialog.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="./components/tm-utils.js"></script>
    <script src="./components/page-modals/tm-assign-trip-modal.js"></script>
    <script src="./components/page-modals/tm-edit-trip-modal.js"></script>
    <script src="./components/page-modals/tm-assign-driver-modal.js"></script>
    <script src="./components/page-modals/tm-end-trip-modal.js"></script>
    <script src="./components/page-modals/tm-add-fuel-log-modal.js"></script>
    <script src="./components/page-modals/tm-add-garage-modal.js"></script>
    <script src="./components/page-modals/tm-view-trip-modal.js"></script>
    <script src="./components/page-modals/tm-view-fuel-modal.js"></script>
    <script src="./components/dashboard-overview/script.js"></script>
    <script src="./components/trips/script.js"></script>
    <script src="./components/trip-log/script.js"></script>
    <script src="./components/fuel-log/script.js"></script>
    <script src="./components/garages/script.js"></script>
    <script src="./components/fleet/script.js"></script>
    <script src="./components/fleet-details/script.js"></script>
    <script src="./components/driver-assignment/script.js"></script>

    <script src="../../js/dashboard-init.js"></script>
    <script src="script.js"></script>
</body>
</html>
