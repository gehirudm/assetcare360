<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supervisor Dashboard - AssetCare360</title>

    <!-- FontAwesome -->
    <script src="https://kit.fontawesome.com/a422e631ad.js" crossorigin="anonymous"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <ac-layout
        title="Supervisor Dashboard"
        icon="fa-user-tie"
        active-section="dashboard"
        nav='[
            {"section":"dashboard","icon":"fas fa-chart-line","label":"Dashboard"},
            {"section":"analytics","icon":"fas fa-chart-pie","label":"Analytics"},
            {"section":"daily-check-reports","icon":"fas fa-clipboard-check","label":"Weekly Check Reports"},
            {"section":"fault-ticket-tracking","icon":"fas fa-ticket-alt","label":"Fault Tickets"},
            {"section":"repair-management","icon":"fas fa-tools","label":"Repair Management"},
            {"section":"budget-approval","icon":"fas fa-dollar-sign","label":"Budget Approval"},
            {"section":"asset-status","icon":"fas fa-truck","label":"Asset Status"},
            {"section":"technicians","icon":"fas fa-user-cog","label":"Technicians"},
            {"section":"notifications","icon":"fas fa-bell","label":"Notifications","badge":true}
        ]'>
                <section class="content-section active" id="dashboard">
                    <supervisor-dashboard-overview></supervisor-dashboard-overview>
                </section>

                <section class="content-section" id="analytics">
                    <supervisor-analytics-hub></supervisor-analytics-hub>
                </section>

                <!-- Weekly Check Reports Section -->
                <section class="content-section" id="daily-check-reports">
                    <supervisor-daily-check-reports></supervisor-daily-check-reports>
                </section>

                <!-- Fault Tickets Section -->
                <section class="content-section" id="fault-ticket-tracking">
                    <supervisor-fault-tickets></supervisor-fault-tickets>
                </section>

                <section class="content-section" id="ticket-details">
                    <supervisor-ticket-detail-view
                        default-return-section="fault-ticket-tracking"
                    ></supervisor-ticket-detail-view>
                </section>

                <section class="content-section" id="breakdown-details">
                    <ac-breakdown-detail-view
                        role-context="supervisor"
                        default-return-section="fault-ticket-tracking"
                        list-label="Fault Tickets"
                        dashboard-label="Supervisor Dashboard"
                    ></ac-breakdown-detail-view>
                </section>

                <!-- Repair Management Section -->
                <section class="content-section" id="repair-management">
                    <supervisor-repair-management></supervisor-repair-management>
                </section>

                <!-- Budget Approval Section -->
                <section class="content-section" id="budget-approval">
                    <supervisor-budget-approval></supervisor-budget-approval>
                </section>

                <!-- Asset Status Section -->
                <section class="content-section" id="asset-status">
                    <supervisor-asset-status></supervisor-asset-status>
                </section>

                <!-- Technicians Section -->
                <section class="content-section" id="technicians">
                    <supervisor-technicians></supervisor-technicians>
                </section>

                <!-- Notifications Section -->
                <section class="content-section" id="notifications">
                    <supervisor-notifications></supervisor-notifications>
                </section>
    </ac-layout>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <supervisor-create-ticket-modal></supervisor-create-ticket-modal>
    <supervisor-assign-ticket-modal></supervisor-assign-ticket-modal>
    <supervisor-view-ticket-modal></supervisor-view-ticket-modal>
    <supervisor-garage-approval-modal></supervisor-garage-approval-modal>

    <!-- Shared Components -->
    <confirm-dialog></confirm-dialog>

    <!-- Scripts -->
    <script src="../../js/config.js?v=4"></script>
    <script src="../../js/api.js?v=4"></script>
    <script src="../../js/auth.js?v=4"></script>
    <script src="../../components/shared/ac-header.js"></script>
    <script src="../../components/shared/ac-sidebar.js"></script>
    <script src="../../components/shared/ac-layout.js"></script>
    <script src="../../components/shared/ac-breakdown-detail-view.js"></script>
    <script src="../../components/styles/buttons.js"></script>
    <script src="../../components/styles/icons.js"></script>
    <script src="../../components/shared/confirm-dialog.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="../../js/dashboard-init.js"></script>
    <script src="./components/dashboard-overview/script.js"></script>
    <script src="./components/analytics-hub/script.js"></script>
    <script src="./components/asset-status/script.js"></script>
    <script src="./components/notifications/script.js"></script>
    <script src="./components/fault-tickets/script.js"></script>
    <script src="./components/ticket-details/script.js"></script>
    <script src="./components/repair-management/script.js"></script>
    <script src="./components/budget-approval/script.js"></script>
    <script src="./components/technicians/script.js"></script>
    <script src="./components/page-modals/create-ticket-modal/script.js"></script>
    <script src="./components/page-modals/assign-ticket-modal/script.js"></script>
    <script src="./components/page-modals/view-ticket-modal/script.js"></script>
    <script src="./components/page-modals/garage-approval-modal/script.js"></script>
    <script src="./components/page-modals/report-details-modal/script.js"></script>
    <script src="./components/page-modals/rejection-reason-modal/script.js"></script>
    <script src="./components/daily-check-reports/script.js"></script>
    <script src="script.js?v=8"></script>
</body>

</html>
