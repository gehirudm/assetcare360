<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Administration Dashboard</title>
    
    <!-- FontAwesome -->
    <script src="https://kit.fontawesome.com/a422e631ad.js" crossorigin="anonymous"></script>
    
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <ac-layout
        title="System Administration Dashboard"
        icon="fa-user-shield"
        active-section="dashboard"
        nav='[
            {"section":"dashboard","icon":"fas fa-chart-line","label":"Dashboard"},
            {"section":"user-accounts","icon":"fas fa-users","label":"User Accounts"},
            {"section":"service-config","icon":"fas fa-cogs","label":"Service Configuration"},
            {"section":"petty-cash-config","icon":"fas fa-money-bill-wave","label":"Petty Cash Config"},
            {"section":"notifications-config","icon":"fas fa-envelope","label":"Notification Templates"},
            {"section":"system-logs","icon":"fas fa-clipboard-list","label":"System Logs"},
            {"section":"activity-tracking","icon":"fas fa-chart-bar","label":"User Activity Tracking"}
        ]'>
                <!-- Dashboard Section -->
                <section class="content-section active" id="dashboard">
                    <sa-dashboard-overview></sa-dashboard-overview>
                </section>

                <!-- User Accounts Section -->
                <section class="content-section" id="user-accounts">
                    <sa-user-accounts></sa-user-accounts>
                </section>

                <!-- Service Configuration Section -->
                <section class="content-section" id="service-config">
                    <sa-service-config></sa-service-config>
                </section>

                <!-- Petty Cash Configuration Section -->
                <section class="content-section" id="petty-cash-config">
                    <sa-petty-cash-config></sa-petty-cash-config>
                </section>

                <!-- Notification Templates Section -->
                <section class="content-section" id="notifications-config">
                    <sa-notifications-config></sa-notifications-config>
                </section>

                <!-- System Logs Section -->
                <section class="content-section" id="system-logs">
                    <sa-system-logs></sa-system-logs>
                </section>

                <!-- User Activity Tracking Section -->
                <section class="content-section" id="activity-tracking">
                    <sa-activity-tracking></sa-activity-tracking>
                </section>

    </ac-layout>

    <!-- Modals -->
    <sa-create-user-modal></sa-create-user-modal>
    <sa-edit-user-modal></sa-edit-user-modal>
    <sa-reset-password-modal></sa-reset-password-modal>
    <sa-add-service-interval-modal></sa-add-service-interval-modal>
    <sa-set-petty-cash-limit-modal></sa-set-petty-cash-limit-modal>
    <sa-create-template-modal></sa-create-template-modal>
    <sa-create-role-modal></sa-create-role-modal>
    <sa-details-modal></sa-details-modal>
    <sa-delete-confirm-modal></sa-delete-confirm-modal>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        Action completed successfully!
    </div>

    <!-- Shared Components -->
    <confirm-dialog></confirm-dialog>

    <!-- Load dependencies in correct order - NO type="module" -->
    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../components/shared/ac-header.js"></script>
    <script src="../../components/shared/ac-sidebar.js"></script>
    <script src="../../components/shared/ac-layout.js"></script>
    <script src="../../components/styles/buttons.js"></script>
    <script src="../../components/styles/icons.js"></script>
    <script src="../../components/shared/confirm-dialog.js"></script>
    <script src="./components/page-modals/sa-create-user-modal.js"></script>
    <script src="./components/page-modals/sa-edit-user-modal.js"></script>
    <script src="./components/page-modals/sa-reset-password-modal.js"></script>
    <script src="./components/page-modals/sa-add-service-interval-modal.js"></script>
    <script src="./components/page-modals/sa-set-petty-cash-limit-modal.js"></script>
    <script src="./components/page-modals/sa-create-template-modal.js"></script>
    <script src="./components/page-modals/sa-create-role-modal.js"></script>
    <script src="./components/page-modals/sa-details-modal.js"></script>
    <script src="./components/page-modals/sa-delete-confirm-modal.js"></script>
    <script src="./components/sa-dashboard-overview.js"></script>
    <script src="./components/sa-user-accounts.js"></script>
    <script src="./components/sa-service-config.js"></script>
    <script src="./components/sa-petty-cash-config.js"></script>
    <script src="./components/sa-notifications-config.js"></script>
    <script src="./components/sa-system-logs.js"></script>
    <script src="./components/sa-activity-tracking.js"></script>
    <script src="../../js/dashboard-init.js"></script>
    
    <!-- Load page scripts -->
    <script src="./script.js"></script>
</body>
</html>
