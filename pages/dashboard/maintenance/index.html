<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Manager Dashboard</title>

    <!-- Icons -->
    <script src="https://kit.fontawesome.com/a422e631ad.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <ac-layout
        title="Maintenance Manager Dashboard"
        icon="fa-wrench"
        active-section="dashboard"
        nav='[
            {"section":"dashboard","icon":"fas fa-chart-bar","label":"Dashboard"},
            {"section":"fault-tickets","icon":"fas fa-ticket-alt","label":"Fault Tickets"},
            {"section":"service-records","icon":"fas fa-file-alt","label":"Service Records"},
            {"section":"cost-approvals","icon":"fas fa-money-bill-wave","label":"Cost Approvals"},
            {"section":"service-warranty","icon":"fas fa-shield-alt","label":"Service &amp; Warranty Monitor"},
            {"section":"service-reports","icon":"fas fa-clipboard-list","label":"Service Report Management"},
            {"section":"notifications","icon":"fas fa-bell","label":"Notifications"}
        ]'>
                <!-- Dashboard Section -->
                <section class="content-section active" id="dashboard">
                    <maintenance-dashboard-overview></maintenance-dashboard-overview>
                </section>

                <!-- Fault Tickets Section -->
                <section class="content-section" id="fault-tickets">
                    <maintenance-fault-tickets></maintenance-fault-tickets>
                </section>

                <!-- Service Records Section -->
                <section class="content-section" id="service-records">
                    <maintenance-service-records></maintenance-service-records>
                </section>

                <!-- Cost Approvals -->
                <section class="content-section" id="cost-approvals">
                    <maintenance-cost-approvals></maintenance-cost-approvals>
                </section>

                <!-- Service & Warranty Monitoring -->
                <section class="content-section" id="service-warranty">
                    <maintenance-service-warranty></maintenance-service-warranty>
                </section>

                <!-- Service Report Management -->
                <section class="content-section" id="service-reports">
                    <maintenance-service-reports></maintenance-service-reports>
                </section>

                <!-- Notifications -->
                <section class="content-section" id="notifications">
                    <maintenance-notifications></maintenance-notifications>
                </section>
    </ac-layout>

    <!-- Modals -->
    <maintenance-approve-cost-modal></maintenance-approve-cost-modal>
    <maintenance-reject-cost-modal></maintenance-reject-cost-modal>
    <maintenance-ticket-details-modal></maintenance-ticket-details-modal>
    <maintenance-warranty-details-modal></maintenance-warranty-details-modal>

    <maintenance-report-details-modal></maintenance-report-details-modal>

    <maintenance-cost-details-modal></maintenance-cost-details-modal>
    <maintenance-service-schedule-modal></maintenance-service-schedule-modal>
    <maintenance-add-service-record-modal></maintenance-add-service-record-modal>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        Action completed successfully!
    </div>

    <!-- Shared Components -->
    <confirm-dialog></confirm-dialog>

    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../components/shared/ac-header.js"></script>
    <script src="../../components/shared/ac-sidebar.js"></script>
    <script src="../../components/shared/ac-layout.js"></script>
    <script src="../../components/styles/buttons.js"></script>
    <script src="../../components/styles/icons.js"></script>
    <script src="../../components/shared/confirm-dialog.js"></script>
    <script src="./components/page-modals/maintenance-approve-cost-modal.js"></script>
    <script src="./components/page-modals/maintenance-reject-cost-modal.js"></script>
    <script src="./components/page-modals/maintenance-cost-details-modal.js"></script>
    <script src="./components/page-modals/maintenance-report-details-modal.js"></script>
    <script src="./components/page-modals/maintenance-ticket-details-modal.js"></script>
    <script src="./components/page-modals/maintenance-warranty-details-modal.js"></script>
    <script src="./components/page-modals/maintenance-service-schedule-modal.js"></script>
    <script src="./components/page-modals/maintenance-add-service-record-modal.js"></script>
    <script src="./components/maintenance-dashboard-overview.js"></script>
    <script src="./components/maintenance-fault-tickets.js"></script>
    <script src="./components/maintenance-service-records.js"></script>
    <script src="./components/maintenance-cost-approvals.js"></script>
    <script src="./components/maintenance-service-warranty.js"></script>
    <script src="./components/maintenance-service-reports.js"></script>
    <script src="./components/maintenance-notifications.js"></script>
    <script src="../../js/dashboard-init.js"></script>
    <script src="script.js"></script>

</body>
</html>
