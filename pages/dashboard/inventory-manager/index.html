<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Manager Dashboard - AssetCare360</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="./style.css">
    
    <!-- Universal Config and Helper Scripts -->
    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../components/shared/ac-header.js"></script>
    <script src="../../components/shared/ac-sidebar.js"></script>
    <script src="../../components/shared/ac-layout.js"></script>
    <script src="../../components/styles/buttons.js"></script>
    <script src="../../components/styles/icons.js"></script>
    <script src="../../components/shared/confirm-dialog.js"></script>
    <script src="../../js/dashboard-init.js"></script>
    
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading"></div>
    </div>

    <ac-layout
        title="Inventory Manager Dashboard"
        icon="fa-boxes"
        active-section="dashboard"
        nav='[
            {"section":"dashboard","icon":"fas fa-tachometer-alt","label":"Dashboard"},
            {"section":"machines","icon":"fas fa-cogs","label":"Manage Machines"},
            {"section":"vehicles","icon":"fas fa-truck","label":"Manage Vehicles"},
            {"section":"catalog","icon":"fas fa-list-alt","label":"Spare Parts Catalog"},
            {"section":"sparepart-addition","icon":"fas fa-plus-circle","label":"Sparepart Addition"},
            {"section":"orders-approvals","icon":"fas fa-clipboard-check","label":"Orders &amp; Approvals"},
            {"section":"usage-tracking","icon":"fas fa-chart-line","label":"Usage Tracking"},
            {"section":"notifications","icon":"fas fa-bell","label":"Notifications","badge":true}
        ]'>
                <!-- Dashboard Section -->
                <section class="content-section active" id="dashboard">
                    <inventory-dashboard-overview></inventory-dashboard-overview>
                </section>

                <!-- Machines Section -->
                <section class="content-section" id="machines">
                    <inventory-machines></inventory-machines>
                </section>

                <!-- Vehicles Section -->
                <section class="content-section" id="vehicles">
                    <inventory-vehicles></inventory-vehicles>
                </section>

                <!-- Spare Parts Catalog -->
                <section class="content-section" id="catalog">
                    <inventory-catalog></inventory-catalog>
                </section>

                <!-- Orders & Approvals -->
                <section class="content-section" id="orders-approvals">
                    <inventory-orders-approvals></inventory-orders-approvals>
                </section>

                <!-- Sparepart Addition Section -->
                <section class="content-section" id="sparepart-addition">
                    <inventory-sparepart-addition></inventory-sparepart-addition>
                </section>

                <!-- Usage Tracking -->
                <section class="content-section" id="usage-tracking">
                    <inventory-usage-tracking></inventory-usage-tracking>
                </section>

                <!-- Notifications -->
                <section class="content-section" id="notifications">
                    <inventory-notifications></inventory-notifications>
                </section>
    </ac-layout>

    <inventory-add-part-modal></inventory-add-part-modal>
    <inventory-edit-part-modal></inventory-edit-part-modal>
    <inventory-delete-modal></inventory-delete-modal>
    <inventory-reorder-modal></inventory-reorder-modal>
    <inventory-add-stock-modal></inventory-add-stock-modal>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        Action completed successfully!
    </div>

    <!-- Shared Components -->
    <confirm-dialog></confirm-dialog>

    <!-- Load JavaScript -->
    <script src="./components/dashboard-overview/script.js"></script>
    <script src="./components/usage-tracking/script.js"></script>
    <script src="./components/notifications/script.js"></script>
    <script src="./components/orders-approvals/script.js"></script>
    <script src="./components/catalog/script.js"></script>
    <script src="./components/sparepart-addition/script.js"></script>
    <script src="./components/page-modals/add-part-modal/script.js"></script>
    <script src="./components/page-modals/edit-part-modal/script.js"></script>
    <script src="./components/page-modals/delete-modal/script.js"></script>
    <script src="./components/page-modals/reorder-modal/script.js"></script>
    <script src="./components/page-modals/add-stock-modal/script.js"></script>
    <script src="./components/page-modals/script.js"></script>
    <script src="./components/page-modals/machine-form-modal/script.js"></script>
    <script src="./components/page-modals/machine-details-modal/script.js"></script>
    <script src="./components/page-modals/vehicle-form-modal/script.js"></script>
    <script src="./components/page-modals/vehicle-details-modal/script.js"></script>
    <script src="./components/page-modals/vehicle-mileage-modal/script.js"></script>
    <script src="./components/machines/script.js"></script>
    <script src="./components/vehicles/script.js"></script>
    <script src="script.js?v=1.7.0"></script>
</body>
</html>
