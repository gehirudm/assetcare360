<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machinery Operator Dashboard - AssetCare360</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <ac-layout
        title="Machinery Operator Dashboard"
        icon="fa-cogs"
        active-section="dashboard"
        nav='[
            {"section":"dashboard","icon":"fas fa-chart-line","label":"Dashboard"},
            {"section":"fault-reporting","icon":"fas fa-exclamation-triangle","label":"Fault Reporting"},
            {"section":"condition-updates","icon":"fas fa-clipboard-check","label":"Weekly Check Reports"},
            {"section":"ticket-tracking","icon":"fas fa-ticket-alt","label":"Ticket Tracking"},
            {"section":"notifications","icon":"fas fa-bell","label":"Notifications","badge":true}
        ]'>
        <section class="content-section active" id="dashboard">
            <mo-dashboard-overview></mo-dashboard-overview>
        </section>

        <section class="content-section" id="fault-reporting">
            <mo-fault-reporting></mo-fault-reporting>
        </section>

        <section class="content-section" id="condition-updates">
            <mo-condition-updates></mo-condition-updates>
        </section>

        <section class="content-section" id="ticket-tracking">
            <mo-ticket-tracking></mo-ticket-tracking>
        </section>

        <section class="content-section" id="notifications">
            <mo-notifications></mo-notifications>
        </section>
    </ac-layout>

    <mo-report-fault-modal></mo-report-fault-modal>
    <mo-edit-fault-modal></mo-edit-fault-modal>
    <mo-condition-update-modal></mo-condition-update-modal>
    <mo-machine-details-modal></mo-machine-details-modal>
    <mo-machine-breakdown-details-modal></mo-machine-breakdown-details-modal>
    <mo-weekly-check-details-modal></mo-weekly-check-details-modal>

    <div id="toast" class="toast"></div>

    <confirm-dialog></confirm-dialog>

    <script src="../../js/config.js"></script>
    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/utils.js"></script>
    <script src="../../components/shared/ac-header.js"></script>
    <script src="../../components/shared/ac-sidebar.js"></script>
    <script src="../../components/shared/ac-layout.js"></script>
    <script src="../../components/styles/buttons.js"></script>
    <script src="../../components/styles/icons.js"></script>
    <script src="../../components/shared/confirm-dialog.js"></script>

    <script src="./components/mo-utils.js"></script>
    <script src="./components/page-modals/mo-report-fault-modal.js"></script>
    <script src="./components/page-modals/mo-edit-fault-modal.js"></script>
    <script src="./components/page-modals/mo-condition-update-modal.js"></script>
    <script src="./components/page-modals/mo-machine-details-modal.js"></script>
    <script src="./components/page-modals/mo-machine-breakdown-details-modal.js"></script>
    <script src="./components/page-modals/mo-weekly-check-details-modal.js"></script>
    <script src="./components/mo-dashboard-overview.js"></script>
    <script src="./components/mo-fault-reporting.js"></script>
    <script src="./components/mo-condition-updates.js"></script>
    <script src="./components/mo-ticket-tracking.js"></script>
    <script src="./components/mo-notifications.js"></script>

    <script src="../../js/dashboard-init.js"></script>
    <script src="script.js"></script>
</body>
</html>
