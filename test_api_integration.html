<!DOCTYPE html>
<html>
<head>
    <title>Test Weekly Check Reports API</title>
</head>
<body>
    <h1>Testing Weekly Check Reports Integration</h1>
    <div id="output"></div>

    <script>
        const API_BASE = 'http://localhost:8000/api';
        
        async function testAPIs() {
            const output = document.getElementById('output');
            output.innerHTML = '<p>Loading...</p>';
            
            try {
                // Test vehicle checks API
                const vehicleResponse = await fetch(`${API_BASE}/vehicle-checks`);
                const vehicleData = await vehicleResponse.json();
                
                // Test machine checks API  
                const machineResponse = await fetch(`${API_BASE}/machine-weekly-checks`);
                const machineData = await machineResponse.json();
                
                let html = '<h2>Vehicle Checks API Response:</h2>';
                html += '<pre>' + JSON.stringify(vehicleData, null, 2) + '</pre>';
                
                html += '<h2>Machine Weekly Checks API Response:</h2>';
                html += '<pre>' + JSON.stringify(machineData, null, 2) + '</pre>';
                
                html += '<h2>Combined Reports:</h2>';
                const reports = [];
                
                // Process vehicle checks
                if (vehicleData.success && vehicleData.data) {
                    const checks = Array.isArray(vehicleData.data) ? vehicleData.data : [];
                    checks.forEach(check => {
                        reports.push({
                            id: check.check_id,
                            type: 'driver',
                            asset: check.vehicle_registration,
                            status: check.status
                        });
                    });
                }
                
                // Process machine checks
                if (machineData.status === 'success' && machineData.data && machineData.data.checks) {
                    machineData.data.checks.forEach(check => {
                        reports.push({
                            id: check.check_id,
                            type: 'operator',
                            asset: 'Machine ' + check.machine_id,
                            status: check.status
                        });
                    });
                }
                
                html += '<ul>';
                reports.forEach(r => {
                    html += `<li>${r.id} - ${r.type} - ${r.asset} - ${r.status}</li>`;
                });
                html += '</ul>';
                html += `<p><strong>Total Reports: ${reports.length}</strong></p>`;
                
                output.innerHTML = html;
            } catch (error) {
                output.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
        
        testAPIs();
    </script>
</body>
</html>
